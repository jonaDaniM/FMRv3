<style>
  .owner-maintenance-panel {
    border-left: 5px solid var(--blue);
  }

  .owner-maintenance-tabs {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin:14px 0;
    padding:5px;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--light);
  }

  .owner-maintenance-tab {
    background:transparent;
    color:var(--text);
  }

  .owner-maintenance-tab.is-active {
    border:1px solid #a9c9e3;
    background:white;
    color:var(--blue);
  }

  .owner-maintenance-pane.hidden {
    display:none !important;
  }

  .owner-maintenance-grid {
    display:grid;
    grid-template-columns:minmax(220px,1.5fr) minmax(120px,.5fr) auto;
    gap:10px;
    align-items:end;
  }

  .owner-maintenance-options {
    display:flex;
    flex-wrap:wrap;
    gap:16px;
    margin:10px 0 14px;
  }

  .owner-maintenance-options label {
    display:flex;
    grid-template-columns:none;
    flex-direction:row;
    align-items:center;
    gap:7px;
    margin:0;
  }

  .owner-maintenance-options input[type="checkbox"] {
    width:auto;
  }

  .owner-maintenance-summary {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:8px;
    margin:12px 0;
  }

  .owner-maintenance-summary > div {
    min-width:0;
    padding:10px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--light);
  }

  .owner-maintenance-summary .label {
    display:block;
    color:var(--muted);
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
  }

  .owner-maintenance-summary strong {
    display:block;
    margin-top:5px;
    font-size:18px;
    overflow-wrap:anywhere;
  }

  .owner-maintenance-list {
    display:grid;
    gap:9px;
    margin-top:12px;
  }

  .owner-maintenance-record {
    min-width:0;
    padding:12px;
    border:1px solid var(--border);
    border-radius:9px;
    background:#fff;
  }

  .owner-maintenance-record.success {
    border-left:4px solid var(--success);
  }

  .owner-maintenance-record.error {
    border-left:4px solid var(--danger);
  }

  .owner-maintenance-title {
    font-weight:800;
    overflow-wrap:anywhere;
  }

  .owner-maintenance-meta {
    margin-top:4px;
    color:var(--muted);
    font-size:12px;
    line-height:1.45;
    overflow-wrap:anywhere;
  }

  .owner-ledger-group {
    border-left:4px solid #8bbfe2;
  }

  .owner-ledger-group.error {
    border-left-color:var(--danger);
  }

  .owner-ledger-materials {
    display:grid;
    gap:8px;
    margin:10px 0 4px;
  }

  .owner-ledger-material {
    min-width:0;
    padding:10px 11px;
    border:1px solid #cfe0ed;
    border-radius:8px;
    background:#f8fbfe;
  }

  .owner-ledger-material-grid {
    display:grid;
    grid-template-columns:minmax(140px,.85fr) minmax(80px,.45fr)
      minmax(85px,.4fr) minmax(150px,1.2fr);
    gap:8px;
  }

  .owner-ledger-material-field {
    min-width:0;
  }

  .owner-ledger-material-field.description {
    grid-column:1 / -1;
    margin-top:2px;
    padding-top:7px;
    border-top:1px solid var(--border);
  }

  .owner-ledger-material-label {
    display:block;
    margin-bottom:3px;
    color:var(--muted);
    font-size:10px;
    font-weight:800;
    letter-spacing:.025em;
    text-transform:uppercase;
  }

  .owner-ledger-material-value {
    display:block;
    min-width:0;
    color:var(--text);
    font-size:13px;
    font-weight:750;
    line-height:1.4;
    text-align:left;
    white-space:normal;
    overflow-wrap:anywhere;
  }

  .owner-ledger-material-field.description .owner-ledger-material-value {
    font-size:14px;
  }

  .owner-ledger-transaction {
    display:grid;
    grid-template-columns:minmax(130px,.8fr) 90px minmax(180px,1fr);
    gap:8px;
    padding:8px 0;
    border-top:1px solid var(--border);
    font-size:12px;
  }

  .owner-ledger-transaction:first-child {
    border-top:0;
  }

  .owner-group-reference {
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-weight:700;
  }

  .owner-correction-preview {
    margin-top:12px;
    padding:12px;
    border:1px solid #f0c36a;
    border-radius:9px;
    background:#fffaf0;
  }

  .owner-correction-material-summary {
    margin:12px 0;
    padding:12px;
    border:1px solid #b8d7ed;
    border-left:5px solid var(--blue);
    border-radius:9px;
    background:#f5faff;
  }

  .owner-correction-material-summary h4 {
    margin:0 0 8px;
  }

  .owner-correction-transaction-list {
    display:grid;
    gap:7px;
    margin-top:10px;
  }

  .owner-correction-transaction-row {
    display:grid;
    grid-template-columns:minmax(130px,.75fr) minmax(70px,.35fr)
      minmax(180px,1.3fr);
    gap:8px;
    padding:8px 9px;
    border:1px solid var(--border);
    border-radius:7px;
    background:white;
  }

  .owner-verification-panel {
    margin:12px 0;
    padding:12px;
    border:1px solid #d4b45c;
    border-radius:9px;
    background:#fff9e9;
  }

  .owner-verification-code {
    display:inline-block;
    margin-top:5px;
    padding:7px 12px;
    border:1px solid #d4b45c;
    border-radius:7px;
    background:#fff;
    color:var(--text);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:22px;
    font-weight:900;
    letter-spacing:.12em;
  }

  .owner-correction-preview details {
    margin-top:12px;
  }

  .owner-correction-preview pre {
    max-height:300px;
    overflow:auto;
    padding:10px;
    border:1px solid var(--border);
    border-radius:7px;
    background:white;
    font-size:11px;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
  }

  .owner-correction-progress {
    display:none;
    align-items:center;
    gap:10px;
    margin:12px 0;
    padding:11px 12px;
    border:1px solid #b8d7ed;
    border-radius:9px;
    background:#f5faff;
    color:var(--text);
    font-size:13px;
    font-weight:700;
  }

  .owner-correction-progress.is-active {
    display:flex;
  }

  .owner-correction-spinner {
    width:18px;
    height:18px;
    flex:0 0 18px;
    border:3px solid #cfe0ed;
    border-top-color:var(--blue);
    border-radius:50%;
    animation:owner-correction-spin .75s linear infinite;
  }

  .owner-correction-progress-text {
    min-width:0;
    overflow-wrap:anywhere;
  }

  #omCorrectionApply.is-busy,
  #omLedgerSearch.is-busy {
    cursor:wait;
    opacity:.78;
  }

  @keyframes owner-correction-spin {
    to {
      transform:rotate(360deg);
    }
  }


  .owner-drive-access-card {
    margin:12px 0 14px;
    padding:12px 14px;
    border:1px solid #cfe0ed;
    border-left:4px solid var(--blue);
    border-radius:9px;
    background:#f8fbfe;
  }

  .owner-drive-access-row {
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    margin-top:9px;
  }

  .owner-drive-access-message {
    margin-top:5px;
    color:var(--muted);
    font-size:12px;
    line-height:1.45;
    overflow-wrap:anywhere;
  }

  .owner-drive-access-message.success {
    color:var(--success);
    font-weight:700;
  }

  .owner-drive-access-message.error {
    color:var(--danger);
    font-weight:700;
  }

  @media(max-width:760px) {
    .owner-maintenance-grid,
    .owner-ledger-transaction,
    .owner-ledger-material-grid,
    .owner-correction-transaction-row {
      grid-template-columns:1fr;
    }

    .owner-ledger-material-field.description {
      grid-column:auto;
    }
  }
</style>

<script>
(() => {
  /**
   * Alpha 30.1 performance guard.
   *
   * Index.html contains all three views in the DOM, so checking only for
   * #ownerView is not enough: Field/Admin sessions also have that hidden node.
   *
   * Exit before creating the Owner Maintenance panel or making any Owner-only
   * google.script.run calls unless the requested interface is actually Owner.
   * Owner behavior is otherwise unchanged.
   */
  const requestedView =
    (
      typeof REQUESTED_VIEW === 'string'
        ? REQUESTED_VIEW
        : ''
    )
      .trim()
      .toLowerCase();

  if (
    requestedView &&
    requestedView !== 'owner'
  ) {
    return;
  }

  const state = {
    migrationPreview:null,
    migrationJob:null,
    autoRunning:false,
    ledger:null,
    correctionPreview:null,
    driveAuthorization:null,
    verifiedDriveFolderId:'',
    recentMigrationJobsLoaded:false,
    correctionApplying:false,
    sizeRepairPreview:null,
    sizeRepairApplying:false
  };

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#039;');
  }

  function callServer(name, ...args) {
    return new Promise((resolve,reject) => {
      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject);
      runner[name](...args);
    });
  }

  function errorText(error) {
    return error && error.message
      ? error.message
      : String(error || 'Unknown error');
  }

  function status(message, isError) {
    const el = document.getElementById('ownerMaintenanceStatus');
    if (!el) return;
    el.textContent = message || '';
    el.style.color = isError ? 'var(--danger)' : '';
  }


  function setCorrectionBusy(
    busy,
    message
  ) {
    state.correctionApplying =
      Boolean(busy);

    const progress =
      document.getElementById(
        'omCorrectionProgress'
      );

    const progressText =
      document.getElementById(
        'omCorrectionProgressText'
      );

    const applyButton =
      document.getElementById(
        'omCorrectionApply'
      );

    const cancelButton =
      document.getElementById(
        'omCorrectionCancel'
      );

    const ledgerSearchButton =
      document.getElementById(
        'omLedgerSearch'
      );

    if (progress) {
      progress.classList.toggle(
        'is-active',
        Boolean(busy)
      );

      progress.setAttribute(
        'aria-busy',
        busy
          ? 'true'
          : 'false'
      );
    }

    if (
      progressText &&
      message
    ) {
      progressText.textContent =
        message;
    }

    if (applyButton) {
      applyButton.disabled =
        Boolean(busy);

      applyButton.classList.toggle(
        'is-busy',
        Boolean(busy)
      );

      applyButton.textContent =
        busy
          ? 'Applying Reversal…'
          : 'Apply Reversal';
    }

    if (cancelButton) {
      cancelButton.disabled =
        Boolean(busy);
    }

    if (ledgerSearchButton) {
      ledgerSearchButton.disabled =
        Boolean(busy);
    }
  }

  function setLedgerSearchBusy(
    busy
  ) {
    const button =
      document.getElementById(
        'omLedgerSearch'
      );

    if (!button) {
      return;
    }

    button.disabled =
      Boolean(busy);

    button.classList.toggle(
      'is-busy',
      Boolean(busy)
    );

    button.textContent =
      busy
        ? 'Searching…'
        : 'Search';
  }

  function insertPanel() {
    const ownerView = document.getElementById('ownerView');
    if (!ownerView || document.getElementById('ownerMaintenancePanel')) return;

    const panel = document.createElement('section');
    panel.id = 'ownerMaintenancePanel';
    panel.className = 'panel owner-maintenance-panel';
    panel.innerHTML = `
      <div class="section-heading">
        <div>
          <h2>Owner Maintenance Center</h2>
          <p>
            High-volume historical migration and controlled correction of
            material transactions. Original transaction history is retained.
          </p>
        </div>
      </div>

      <div class="owner-maintenance-tabs">
        <button id="omMigrationTab" type="button"
          class="owner-maintenance-tab is-active">Historical FMR Migration</button>
        <button id="omCorrectionTab" type="button"
          class="owner-maintenance-tab">Transaction Correction</button>
      </div>

      <div id="ownerMaintenanceStatus" class="status"></div>

      <section id="omMigrationPane" class="owner-maintenance-pane">
        <h3>Historical FMR Migration</h3>
        <p>
          Select a Drive folder containing Excel workbooks or Google Sheets.
          Valid FMRs are processed through the existing parser, staging service,
          and publisher in resumable chunks.
        </p>

        <div id="omDriveAccessCard" class="owner-drive-access-card">
          <strong>Google Drive Access</strong>

          <div id="omDriveAccessMessage" class="owner-drive-access-message">
            Checking the Google account and Drive authorization…
          </div>

          <div class="owner-drive-access-row">
            <button id="omDriveAuthorizationButton" type="button" class="secondary">
              Check Drive Authorization
            </button>

            <button id="omDriveProbeButton" type="button" class="secondary">
              Test Folder Access
            </button>
          </div>
        </div>

        <div class="owner-maintenance-grid">
          <label>
            Drive Folder URL or ID
            <input id="omMigrationFolder" autocomplete="off"
              placeholder="https://drive.google.com/drive/folders/...">
          </label>

          <label>
            FMRs / Server Pass
            <select id="omMigrationChunk">
              <option value="5">5</option>
              <option value="10" selected>10</option>
              <option value="20">20</option>
              <option value="25">25</option>
            </select>
          </label>

          <button id="omMigrationPreview" type="button" class="secondary">
            Preview Folder
          </button>
        </div>

        <div class="owner-maintenance-options">
          <label><input id="omMigrationRecursive" type="checkbox">Include subfolders</label>
          <label><input id="omMigrationWarnings" type="checkbox">Auto-publish WARNING items</label>
          <label><input id="omMigrationAuto" type="checkbox" checked>Continue automatically</label>
        </div>

        <p class="muted">
          A server pass works on one source workbook at a time and publishes up
          to the selected number of FMRs from that workbook. Continue
          automatically starts additional server passes until the job finishes.
          Keep this Owner tab open while automatic continuation is running.
          Generated <code>_FMRv3_Historical_Migration_Working_*</code> folders
          are excluded from recursive discovery.
        </p>

        <div class="button-row">
          <button id="omMigrationStart" type="button" disabled>Start Migration</button>
          <button id="omMigrationNext" type="button" class="secondary" disabled>
            Process Next Server Pass
          </button>
        </div>

        <p class="muted">
          Historical migration preserves the existing Alpha 29 request-only
          policy: legacy Issued / Backordered / Action Taken cells remain
          source evidence and do not create live transactions.
        </p>

        <div id="omMigrationSummary"></div>
        <div id="omMigrationFiles"></div>

        <h4>Historical Size Reconciliation</h4>
        <p>
          Alpha 30.4 scans the existing import issue evidence for Sizes that
          Excel / Google converted into dates, traces each affected material
          through import, staging, published, and Bag &amp; Tag records, and
          previews an evidence-backed correction before any write occurs.
        </p>

        <div class="button-row">
          <button id="omSizeRepairPreview" type="button" class="secondary">
            Preview Size Repair
          </button>
        </div>

        <p class="muted">
          This does not perform a global find/replace. Apply requires an exact
          verification phrase and creates an automatic database backup first.
        </p>

        <div id="omSizeRepairResults"></div>

        <h4>Recent Migration Jobs</h4>
        <div id="omMigrationRecent">
          <div class="register-empty">Loading recent migration jobs…</div>
        </div>
      </section>

      <section id="omCorrectionPane" class="owner-maintenance-pane hidden">
        <h3>Transaction Correction</h3>
        <p>
          Search by FMR or ISO. Each transaction group shows the exact material
          identity before Preview Reversal is available.
        </p>

        <div class="owner-maintenance-grid">
          <label>
            Search Mode
            <select id="omLedgerMode">
              <option value="AUTO">Auto Detect</option>
              <option value="FMR">FMR Number</option>
              <option value="ISO">ISO -##</option>
            </select>
          </label>

          <label>
            FMR or ISO
            <input id="omLedgerQuery" autocomplete="off"
              placeholder="FMR 42 or LP131-PV-180003-17">
          </label>

          <button id="omLedgerSearch" type="button">Search</button>
        </div>

        <div id="omLedgerSummary"></div>
        <div id="omLedgerGroups"></div>
        <div id="omLedgerEntities"></div>
        <div id="omCorrectionPreview"></div>
      </section>
    `;

    const bulkPanel = ownerView.querySelector('.bulk-import-panel');
    if (bulkPanel) bulkPanel.insertAdjacentElement('beforebegin', panel);
    else ownerView.appendChild(panel);

    bind();
  }

  function setTab(name) {
    const migration = name === 'MIGRATION';
    document.getElementById('omMigrationTab').classList.toggle('is-active',migration);
    document.getElementById('omCorrectionTab').classList.toggle('is-active',!migration);
    document.getElementById('omMigrationPane').classList.toggle('hidden',!migration);
    document.getElementById('omCorrectionPane').classList.toggle('hidden',migration);
  }


  function setDriveMessage(message, stateName) {
    const element=document.getElementById('omDriveAccessMessage');
    if (!element) return;

    element.textContent=message||'';
    element.classList.remove('success','error');

    if (stateName==='SUCCESS') {
      element.classList.add('success');
    } else if (stateName==='ERROR') {
      element.classList.add('error');
    }
  }

  function folderValue() {
    const input=document.getElementById('omMigrationFolder');
    return input ? input.value.trim() : '';
  }

  async function checkDriveAuthorization(openConsentIfRequired) {
    setDriveMessage('Checking Google Drive authorization…');

    try {
      const result=await callServer('getOwnerMaintenanceAuthorizationV3');
      state.driveAuthorization=result||null;

      const email=(result&&result.callerEmail)||'current Google account';

      if (result&&result.authorizationRequired) {
        state.verifiedDriveFolderId='';

        setDriveMessage(
          `Drive authorization is required for ${email}.`,
          'ERROR'
        );

        if (
          openConsentIfRequired &&
          result.authorizationUrl
        ) {
          window.open(
            result.authorizationUrl,
            '_blank',
            'noopener'
          );
        }

        return false;
      }

      setDriveMessage(
        `Drive OAuth is authorized for ${email}. Test the exact migration folder before starting.`,
        'SUCCESS'
      );

      return true;
    } catch(error) {
      state.driveAuthorization=null;
      state.verifiedDriveFolderId='';
      setDriveMessage(errorText(error),'ERROR');
      return false;
    }
  }

  async function testMigrationFolderAccess(options) {
    const settings=options||{};
    const folder=folderValue();

    if (!folder) {
      setDriveMessage('Enter a Drive folder URL or ID first.','ERROR');
      return null;
    }

    setDriveMessage('Testing access to the selected Drive folder…');

    try {
      const result=await callServer(
        'probeOwnerMigrationFolderV3',
        folder
      );

      state.verifiedDriveFolderId=
        String(result.folderId||'');

      setDriveMessage(
        `Drive access verified for ${result.callerEmail}: ${result.folderName}.`,
        'SUCCESS'
      );

      return result;
    } catch(error) {
      state.verifiedDriveFolderId='';
      setDriveMessage(errorText(error),'ERROR');

      if (settings.throwOnFailure) {
        throw error;
      }

      return null;
    }
  }

  function migrationOptions() {
    return {
      recursive:document.getElementById('omMigrationRecursive').checked,
      allowWarnings:document.getElementById('omMigrationWarnings').checked
    };
  }

  function renderRecentMigrationJobs(
    result
  ) {
    const container =
      document.getElementById(
        'omMigrationRecent'
      );

    const jobs =
      result &&
      Array.isArray(
        result.jobs
      )
        ? result.jobs
        : [];

    container.innerHTML = `
      <div class="owner-maintenance-list">
        ${jobs.map(job => {
          const jobStatus =
            String(
              job.status ||
              ''
            )
              .trim()
              .toUpperCase();

          const active =
            [
              'READY',
              'RUNNING'
            ].includes(
              jobStatus
            );

          return `
            <div class="owner-maintenance-record">
              <div class="section-heading">
                <div>
                  <div class="owner-maintenance-title">
                    ${esc(job.sourceFolderName)}
                  </div>

                  <div class="owner-maintenance-meta">
                    ${esc(jobStatus)}
                    · ${esc(job.fmrsPublished||0)} published / already existing
                    · ${esc(job.filesCompleted||0)} / ${esc(job.fileCount||0)} files
                    · ${esc(job.updatedAt)}
                  </div>
                </div>

                <div class="button-row">
                  <button
                    type="button"
                    class="small secondary"
                    data-om-load-job="${esc(job.jobId)}">
                    View Job
                  </button>

                  ${active ? `
                    <button
                      type="button"
                      class="small"
                      data-om-resume-job="${esc(job.jobId)}">
                      Resume
                    </button>

                    <button
                      type="button"
                      class="small danger"
                      data-om-abandon-job="${esc(job.jobId)}">
                      Abandon
                    </button>
                  ` : ''}
                </div>
              </div>
            </div>`;
        }).join('') ||
          '<div class="register-empty">No historical migration jobs yet.</div>'}
      </div>`;
  }

  async function loadRecentMigrationJobs() {
    try {
      renderRecentMigrationJobs(
        await callServer('getRecentHistoricalMigrationJobsV3',10)
      );
      state.recentMigrationJobsLoaded=true;
    } catch(error) {
      const container = document.getElementById('omMigrationRecent');
      if (container) {
        container.innerHTML =
          `<div class="alert error">${esc(errorText(error))}</div>`;
      }
    }
  }

  async function loadMigrationJob(
    jobId
  ) {
    status(
      'Loading migration job…'
    );

    try {
      const result =
        await callServer(
          'getHistoricalMigrationJobV3',
          jobId
        );

      renderMigrationJob(
        result
      );

      return result;
    } catch (
      error
    ) {
      status(
        errorText(
          error
        ),
        true
      );

      return null;
    }
  }

  function renderMigrationPreview(
    result
  ) {
    state.migrationPreview =
      result;

    const inv =
      result.inventory ||
      {};

    const activeJob =
      result.activeJob ||
      null;

    document
      .getElementById(
        'omMigrationSummary'
      )
      .innerHTML = `
        <div class="owner-maintenance-summary">
          <div>
            <span class="label">Files</span>
            <strong>${esc(inv.fileCount||0)}</strong>
          </div>

          <div>
            <span class="label">Oversize</span>
            <strong>${esc(inv.oversizeCount||0)}</strong>
          </div>

          <div>
            <span class="label">Mode</span>

  async function previewMigration() {
    const folder=folderValue();
    if (!folder) return status('Enter a Drive folder URL or ID.',true);

    status('Verifying Drive folder access…');

    try {
      await testMigrationFolderAccess({throwOnFailure:true});

      status('Inspecting Drive folder…');

      renderMigrationPreview(
        await callServer(
          'previewHistoricalMigrationV3',
          folder,
          migrationOptions()
        )
      );
    } catch(error) {
      status(errorText(error),true);
    }
  }

  async function startMigration() {
    const preview = state.migrationPreview;
    if (!preview || !preview.canStart) return;

    const confirmation = window.prompt(
      `Type exactly:\n${preview.requiredConfirmation}`
    );

    if (confirmation == null) return;

    const options = Object.assign({},migrationOptions(),{
      confirmation:confirmation,
      notes:'Started from Owner Maintenance Center.'
    });

    status('Creating migration job…');

    try {
      const result = await callServer(
        'startHistoricalMigrationV3',
        document.getElementById('omMigrationFolder').value.trim(),
        options
      );

      renderMigrationJob(result);

      if (document.getElementById('omMigrationAuto').checked) {
        state.autoRunning = true;
        await migrationLoop();
      }
    } catch(error) {
      status(errorText(error),true);
    }
  }

  async function runChunk() {
    const job =
      state.migrationJob &&
      state.migrationJob.job;

    if (
      !job ||
      !job.jobId
    ) {
      status(
        'Start or resume a migration first.',
        true
      );

      return null;
    }

    const size =
      Number(
        document
          .getElementById(
            'omMigrationChunk'
          )
          .value ||
        10
      );

    status(
      (
        'Processing one source-file server pass ' +
        `(up to ${size} publishable FMRs from that file)…`
      )
    );

    try {
      const result =
        await callServer(
          'runHistoricalMigrationChunkV3',
          job.jobId,
          size
        );

      renderMigrationJob(
        result
      );

      return result;
    } catch (
      error
    ) {
      state.autoRunning =
        false;

      status(
        errorText(
          error
        ),
        true
      );

      return null;
    }
  }

  async function migrationLoop() {
    while (
      state.autoRunning
    ) {
      const current =
        state.migrationJob &&
        state.migrationJob.job;

      if (
        !current ||
        [
          'COMPLETE',
          'COMPLETE_WITH_EXCEPTIONS',
          'ABANDONED'
        ].includes(
          String(
            current.status ||
            ''
          )
            .toUpperCase()
        )
      ) {
        state.autoRunning =
          false;

        break;
      }

      const result =
        await runChunk();

      if (
        !result
      ) {
        break;
      }

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            350
          )
      );
    }
  }

  async function resumeMigrationJob(
    jobId
  ) {
    const result =
      await loadMigrationJob(
        jobId
      );

    if (
      !result ||
      !result.job
    ) {
      return;
    }

    const jobStatus =
      String(
        result.job.status ||
        ''
      )
        .trim()
        .toUpperCase();

    if (
      ![
        'READY',
        'RUNNING'
      ].includes(
        jobStatus
      )
    ) {
      return status(
        (
          'Only READY or RUNNING migration jobs can be resumed. ' +
          `Current status: ${jobStatus}`
        ),
        true
      );
    }

    document
      .getElementById(
        'omMigrationAuto'
      )
      .checked =
        true;

    state.autoRunning =
      true;

    status(
      (
        `Resuming ${result.job.jobId}. ` +
        'Keep this Owner tab open while automatic continuation is running.'
      )
    );

    await migrationLoop();
  }

  async function abandonMigrationJob(
    jobId
  ) {
    const shortId =
      String(
        jobId ||
        ''
      )
        .slice(
          -8
        )
        .toUpperCase();

    const required =
      `ABANDON ${shortId}`;

    const confirmation =
      window.prompt(
        (
          'Abandon this interrupted migration job?\n\n' +
          'This does not delete any FMRs already published by the job. ' +
          'It only closes the remaining job so it cannot be resumed.\n\n' +
          'Type exactly:\n' +
          required
        )
      );

    if (
      confirmation ==
      null
    ) {
      return;
    }

    state.autoRunning =
      false;

    status(
      'Abandoning migration job…'
    );

    try {
      renderMigrationJob(
        await callServer(
          'abandonHistoricalMigrationJobV3',
          jobId,
          confirmation
        )
      );
    } catch (
      error
    ) {
      status(
        errorText(
          error
        ),
        true
      );
    }
  }

  function sizeRepairLayerText(candidate) {
    const layers = candidate && candidate.layers || {};
    const parts = [];

    ['bulk','staging','published'].forEach(name => {
      const layer = layers[name] || {};
      if (!layer.exists) return;
      parts.push(
        `${name}: ${esc(layer.current||'—')} (${esc(layer.disposition||'')})`
      );
    });

    const bags = Array.isArray(layers.bags) ? layers.bags : [];
    if (bags.length) {
      parts.push(
        `bags: ${bags.map(bag => `${esc(bag.current||'—')} (${esc(bag.disposition||'')})`).join(', ')}`
      );
    }

    return parts.join(' · ') || 'No downstream material layer found.';
  }

  function renderSizeRepairCandidates(candidates, maximum) {
    const rows = Array.isArray(candidates) ? candidates : [];
    const limit = Math.max(1, Number(maximum || 25));

    return rows.slice(0, limit).map(candidate => `
      <div class="owner-maintenance-record ${candidate.status==='MANUAL_REVIEW'?'error':''}">
        <div class="section-heading">
          <div>

              ${esc(candidate.expectedWrong||'—')} → <strong>${esc(candidate.correctedSize||'—')}</strong>
              · ${esc(candidate.patchCount||0)} cell patch(es)
            </div>
          </div>
        </div>
        <div class="owner-maintenance-meta">
          ${esc(candidate.materialDescription||'')}
        </div>
        <div class="owner-maintenance-meta">
          Evidence: ${esc(candidate.evidenceSourceValue||'—')} · ${esc(candidate.evidenceRule||'')}
        </div>

  async function previewSizeRepair() {
    if (state.sizeRepairApplying) return;

    const button = document.getElementById('omSizeRepairPreview');
    if (button) {
      button.disabled = true;
      button.textContent = 'Scanning…';
    }

    status('Scanning historical Size repair evidence…');

    try {
      const result = await callServer('previewHistoricalSizeReconciliationV3');
      renderSizeRepairPreview(result);

      const ready = result && result.summary && result.summary.readyToRepair || 0;
      status(
        ready
          ? `Size repair preview ready: ${ready} evidence-backed line(s) require correction.`
          : 'Size repair preview complete. No evidence-backed corrections are required.'
      );
    } catch (error) {
      status(errorText(error), true);
    } finally {
      if (button) {
        button.disabled = false;
        button.textContent = 'Preview Size Repair';
      }
    }
  }

  async function applySizeRepair() {
    if (state.sizeRepairApplying || !state.sizeRepairPreview) return;

    const preview = state.sizeRepairPreview;
    const input = document.getElementById('omSizeRepairConfirmation');
    const confirmation = input ? input.value.trim() : '';

    if (confirmation !== String(preview.requiredConfirmation||'')) {
      return status(
        `Verification phrase must exactly match "${preview.requiredConfirmation||''}".`,
        true
      );
    }

    const applyButton = document.getElementById('omSizeRepairApply');
    state.sizeRepairApplying = true;

    if (applyButton) {
      applyButton.disabled = true;
      applyButton.textContent = 'Creating Backup + Repairing…';
    }

    status('Creating automatic backup and applying evidence-backed Size repairs…');

    try {
      const result = await callServer(
        'applyHistoricalSizeReconciliationV3',
        {
          fingerprint: preview.fingerprint,
          confirmation: confirmation
        }
      );

      status(
        result.noOp
          ? 'No Size repair was required.'
          : `Size reconciliation ${result.reconciliationId} applied. Backup: ${result.backupId}. Rechecking…`
      );

      state.sizeRepairPreview = null;
      state.sizeRepairApplying = false;
      await previewSizeRepair();
    } catch (error) {
      status(errorText(error), true);
    } finally {
      state.sizeRepairApplying = false;
      const currentApply = document.getElementById('omSizeRepairApply');
      if (currentApply) {
        currentApply.disabled = false;
        currentApply.textContent = 'Apply Size Repair';
      }
    }
  }

  function materialsForGroup(group) {
    if (Array.isArray(group.materials) && group.materials.length) {
      return group.materials;
    }

    const byId = materialMapFromLedger();

    return Array.from(new Set(
      (group.transactions||[])
        .map(tx => String(tx.fmrLineId||''))
        .filter(Boolean)
    ))
      .map(lineId => byId[lineId])
      .filter(Boolean);
  }

    const id = String(group.groupReference || group.groupId || '');
    return id.length > 8 ? id.slice(-8) : id;

          '<div class="register-empty">No Bag & Tag history.</div>'}
      </div>

      <h4>Backorder History</h4>
      <div class="owner-maintenance-list">
        ${(result.backorders||[]).map(r => `
          <div class="owner-maintenance-record">
            <div class="owner-maintenance-title">${esc(r.requestId)}</div>
            <div class="owner-maintenance-meta">
              ${esc(r.status)} · Requested ${esc(r.qtyRequested)}
              · Confirmed ${esc(r.qtyConfirmed)} · Pending ${esc(r.qtyPending)}
            </div>
          </div>`).join('') ||
          '<div class="register-empty">No backorder history.</div>'}
      </div>`;

    status(
      result.resultCount
        ? `Owner ledger loaded${result.elapsedMs!=null?` in ${result.elapsedMs} ms`:''}.`
        : 'No published FMR / ISO found.'
    );
  }

  async function searchLedger(
    forceDuringCorrection
  ) {
    if (
      state.correctionApplying &&
      !forceDuringCorrection
    ) {
      return;
    }

    const query =
      document
        .getElementById(
          'omLedgerQuery'
        )
        .value
        .trim();

    if (!query) {
      return status(
        'Enter an FMR or ISO.',
        true
      );
    }

    setLedgerSearchBusy(
      true
    );

    status(
      'Loading transaction ledger…'
    );

    try {
      renderLedger(
        await callServer(
          'searchOwnerLedgerV3',
          query,
          document
            .getElementById(
              'omLedgerMode'
            )
            .value
        )
      );
    } catch (
      error
    ) {
      status(
        errorText(
          error
        ),
        true
      );
    } finally {
      setLedgerSearchBusy(
        false
      );
    }
  }

  function findLedgerGroup(groupId) {
    return ((state.ledger && state.ledger.groups)||[])
      .find(group => String(group.groupId||'') === String(groupId||'')) || null;
  }

  function renderPreviewSummary(group) {
    const materials = materialsForGroup(group);

    return `
      <div class="owner-correction-material-summary">
        <h4>You are reversing this exact material transaction</h4>

        <div class="owner-ledger-materials">
          ${materials.map(renderMaterialIdentity).join('')}
        </div>

        <div class="owner-correction-transaction-list">
          ${(group.transactions||[]).map(tx => {
            const material = materials.find(item =>
              String(item.fmrLineId||'') === String(tx.fmrLineId||'')
            );

            return `
              <div class="owner-correction-transaction-row">
                <strong>${esc(tx.type)}</strong>
                <span>${esc(tx.quantity)} ${esc(tx.uom||(material&&material.uom)||'')}</span>
                <span>
                  ${material?esc(material.commodityCode||'—'):'Material unavailable'}
                  ${material&&material.size?` · Size ${esc(material.size)}`:''}
                </span>
              </div>`;
          }).join('')}
        </div>
      </div>`;
  }

  async function previewCorrection(groupId) {
    const group = findLedgerGroup(groupId);
    if (!group) return status('Transaction group is no longer loaded.',true);

    const materials = materialsForGroup(group);

    const materialText = materials.length
      ? '\n\nMaterial: ' + materials.map(material => [
          material.commodityCode,
          material.size ? `Size ${material.size}` : '',
          material.materialDescription
        ].filter(Boolean).join(' · ')).join(' / ')
      : '';

    const reason=window.prompt(
      'Reason for reversing this transaction group:' + materialText
    );

    if (reason==null) return;

    status('Validating dependencies…');

    try {
      const result=await callServer(
        'previewOwnerCorrectionV3',
        {groupId:groupId,reason:reason}
      );

      state.correctionPreview=result;

      document.getElementById('omCorrectionPreview').innerHTML=`
        <div class="owner-correction-preview">
          <h4>Reversal Preview</h4>
          <p>
            Original transactions remain unchanged. Applying this preview creates
            a database backup and appends compensating REVERSAL_* transactions.
          </p>

          ${renderPreviewSummary(group)}

          <div class="owner-verification-panel">
            <strong>4-digit verification code</strong>
            <div class="owner-verification-code">${esc(result.requiredConfirmation)}</div>
            <div class="owner-maintenance-meta">
              Owner authorization, dependency validation, the written reason,
              ScriptLock and the automatic backup remain the actual safeguards.
            </div>
          </div>

          <details>
            <summary>Technical reversal plan</summary>
            <pre>${esc(JSON.stringify(result.plan,null,2))}</pre>
          </details>

          <div
            id="omCorrectionProgress"
            class="owner-correction-progress"
            role="status"
            aria-live="polite"
            aria-busy="false">
            <span
              class="owner-correction-spinner"
              aria-hidden="true"></span>
            <span
              id="omCorrectionProgressText"
              class="owner-correction-progress-text">
              Preparing Owner correction…
            </span>
          </div>

          <div class="button-row">
            <button id="omCorrectionApply" type="button">Apply Reversal</button>
            <button id="omCorrectionCancel" type="button" class="secondary">Cancel</button>
          </div>
        </div>`;

      document.getElementById('omCorrectionApply')
        .addEventListener('click',applyCorrection);

      document.getElementById('omCorrectionCancel')
        .addEventListener('click',()=>{
          state.correctionPreview=null;
          document.getElementById('omCorrectionPreview').innerHTML='';
        });

      status(`Preview passed. Verification code: ${result.requiredConfirmation}`);
    } catch(error) {
      status(errorText(error),true);
    }
  }

  async function applyCorrection() {
    if (
      state.correctionApplying
    ) {
      return;
    }

    const preview =
      state.correctionPreview;

    if (
      !preview ||
      !preview.plan
    ) {
      return;
    }

    const confirmation =
      window.prompt(
        (
          'Enter the 4-digit verification code:\n' +
          preview.requiredConfirmation
        )
      );

    if (
      confirmation ==
      null
    ) {
      return;
    }

    setCorrectionBusy(
      true,
      'Creating the automatic pre-change backup and applying the reversal…'
    );

    status(
      'Creating backup and applying correction…'
    );

    try {
      const result =
        await callServer(
          'applyOwnerCorrectionV3',
          {
            groupId:
              preview.plan.groupId,

            reason:
              preview.reason,

            confirmation:
              confirmation
          }
        );

      const progressText =
        document.getElementById(
          'omCorrectionProgressText'
        );

      if (progressText) {
        progressText.textContent =
          (
            'Reversal applied successfully. ' +
            'Refreshing transaction history and operational state…'
          );
      }

      status(
        (
          'Correction ' +
          result.correctionId +
          ' applied. Refreshing ledger…'
        )
      );

      await searchLedger(
        true
      );

      state.correctionPreview =
        null;

      document
        .getElementById(
          'omCorrectionPreview'
        )
        .innerHTML =
        '';
    } catch (
      error
    ) {
      status(
        errorText(
          error
        ),
        true
      );

      setCorrectionBusy(
        false,
        'Correction failed. Review the error before retrying.'
      );

      return;
    }

    state.correctionApplying =
      false;
  }

  function bind() {
    document.getElementById('omMigrationTab')
      .addEventListener('click',async()=>{
        setTab('MIGRATION');

        if (!state.recentMigrationJobsLoaded) {
          await loadRecentMigrationJobs();
        }
      });

    document.getElementById('omCorrectionTab')
      .addEventListener('click',()=>setTab('CORRECTION'));

    document.getElementById('omMigrationPreview')
      .addEventListener('click',previewMigration);

    document.getElementById('omDriveAuthorizationButton')
      .addEventListener('click',async()=>{
        const authorized=await checkDriveAuthorization(true);

        if (authorized) {
          await testMigrationFolderAccess();
        }
      });

    document.getElementById('omDriveProbeButton')
      .addEventListener('click',()=>testMigrationFolderAccess());

    document.getElementById('omMigrationFolder')
      .addEventListener('input',()=>{
        state.verifiedDriveFolderId='';
      });

    document.getElementById('omMigrationStart')
      .addEventListener('click',startMigration);

    document.getElementById('omMigrationNext')
      .addEventListener('click',async()=>{
        state.autoRunning=false;
        await runChunk();
      });

    document.getElementById('omSizeRepairPreview')
      .addEventListener('click',previewSizeRepair);

    document.getElementById('omLedgerSearch')
      .addEventListener('click',searchLedger);

    document.getElementById('omLedgerQuery')
      .addEventListener('keydown',event=>{
        if (event.key==='Enter') {
          event.preventDefault();
          searchLedger();
        }
      });

    document.getElementById('omMigrationFiles')
      .addEventListener('click',async event=>{
        const button=event.target.closest('[data-om-retry]');
        if (!button) return;

        status('Resetting failed file…');

        try {
          renderMigrationJob(
            await callServer(
              'retryHistoricalMigrationFileV3',
              button.getAttribute('data-om-retry')
            )
          );
        } catch(error) {
          status(errorText(error),true);
        }
      });

    document.getElementById('omLedgerGroups')
      .addEventListener('click',event=>{
        const button=event.target.closest('[data-om-reverse]');
        if (button && !button.disabled) {
          previewCorrection(button.getAttribute('data-om-reverse'));
        }
      });

    document.getElementById('omMigrationRecent')
      .addEventListener('click',event=>{
        const viewButton=
          event.target.closest('[data-om-load-job]');

        if (viewButton) {
          loadMigrationJob(
            viewButton.getAttribute('data-om-load-job')
          );

          return;
        }

        const resumeButton=
          event.target.closest('[data-om-resume-job]');

        if (resumeButton) {
          resumeMigrationJob(
            resumeButton.getAttribute('data-om-resume-job')
          );

          return;
        }

        const abandonButton=
          event.target.closest('[data-om-abandon-job]');

        if (abandonButton) {
          abandonMigrationJob(
            abandonButton.getAttribute('data-om-abandon-job')
          );
        }
      });

    Promise.allSettled([
      checkDriveAuthorization(false),
      loadRecentMigrationJobs()
    ]);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded',insertPanel);
  } else {
    insertPanel();
  }
})();
</script>
