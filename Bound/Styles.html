<style>
  :root {
    --navy: #143b5d;
    --blue: #266092;
    --light: #eef5fb;
    --border: #d7e2ec;
    --text: #18263a;
    --muted: #66778a;
    --danger: #b42318;
    --success: #176b43;
    --warning: #9a6700;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #f4f7fa;
    color: var(--text);
    font-family: Arial, sans-serif;
  }

  .shell {
    width: min(1500px, 100%);
    margin: 0 auto;
    padding: 22px;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    align-items: flex-start;
    padding: 20px;
    background: var(--navy);
    color: white;
    border-radius: 12px;
    margin-bottom: 18px;
  }

  h1, h2, h3, p { margin-top: 0; }

  .topbar p {
    margin-bottom: 0;
    opacity: .85;
  }

  nav {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  nav a {
    color: white;
    text-decoration: none;
    padding: 9px 13px;
    border-radius: 7px;
    font-weight: 700;
  }

  nav a.active,
  nav a:hover {
    background: rgba(255, 255, 255, .18);
  }

  .panel,
  .fmr-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 3px 12px rgba(20, 59, 93, .06);
  }

  .search-grid {
    display: grid;
    grid-template-columns: 180px minmax(240px, 1fr) 130px;
    gap: 10px;
  }

  .owner-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(180px, 1fr));
    gap: 12px;
  }

  .owner-grid .wide { grid-column: span 2; }

  label {
    display: grid;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 12px;
  }

  input,
  select,
  textarea,
  button {
    font: inherit;
  }

  input,
  select,
  textarea {
    width: 100%;
    border: 1px solid #b9c8d6;
    border-radius: 7px;
    padding: 10px 11px;
    background: white;
  }

  textarea {
    resize: vertical;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  button {
    border: 0;
    border-radius: 7px;
    padding: 10px 14px;
    background: var(--blue);
    color: white;
    font-weight: 800;
    cursor: pointer;
  }

  button.secondary {
    background: #e8eef4;
    color: var(--text);
  }

  button.warning { background: #a86f00; }
  button.danger { background: var(--danger); }

  button.small {
    padding: 7px 9px;
    font-size: 12px;
  }

  button:disabled {
    opacity: .55;
    cursor: wait;
  }

  .status,
  .muted {
    color: var(--muted);
    font-size: 13px;
    margin-top: 10px;
  }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }

  .kpi {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }

  .kpi span { display: block; }

  .kpi .label {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 6px;
  }

  .kpi .value {
    font-size: 22px;
    font-weight: 800;
  }

  .summary-strip {
    display: grid;
    grid-template-columns: repeat(8, minmax(85px, 1fr));
    gap: 7px;
    margin: 12px 0;
  }

  .summary-cell {
    background: var(--light);
    border-radius: 7px;
    padding: 9px;
    text-align: center;
  }

  .summary-cell .label {
    display: block;
    color: var(--muted);
    font-size: 11px;
  }

  .summary-cell .value {
    display: block;
    font-weight: 800;
    margin-top: 3px;
  }

  .table-wrap { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 1150px;
  }

  th,
  td {
    text-align: left;
    padding: 9px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    font-size: 12px;
  }

  th { background: var(--light); }

  .button-row,
  .material-actions,
  .queue-actions,
  .section-heading {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .section-heading { justify-content: space-between; }

  .queue-item {
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 13px;
    margin-bottom: 10px;
  }

  .queue-title {
    font-weight: 800;
    margin-bottom: 5px;
  }

  .queue-meta {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.5;
  }

  .alert {
    padding: 12px 14px;
    border-radius: 8px;
    margin-bottom: 14px;
  }

  .alert.error {
    color: var(--danger);
    background: #fee4e2;
  }

  .alert.success {
    color: var(--success);
    background: #dcfae6;
  }

  .hidden { display: none !important; }

  .modal {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, .65);
    display: grid;
    place-items: center;
    padding: 18px;
    z-index: 1000;
  }

  .modal-card {
    position: relative;
    width: min(620px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    background: white;
    border-radius: 12px;
    padding: 20px;
  }

  .icon-button {
    position: absolute;
    top: 12px;
    right: 12px;
    background: transparent;
    color: var(--text);
    font-size: 23px;
    padding: 4px 9px;
  }

  @media (max-width: 950px) {
    .kpi-grid { grid-template-columns: repeat(3, 1fr); }
    .summary-strip { grid-template-columns: repeat(4, 1fr); }
    .owner-grid { grid-template-columns: 1fr 1fr; }
    .admin-filter-grid { grid-template-columns: 1fr 1fr; }
  }

  @media (max-width: 680px) {
    .shell { padding: 12px; }
    .topbar { flex-direction: column; }
    .search-grid,
    .owner-grid,
    .admin-filter-grid { grid-template-columns: 1fr; }
    .owner-grid .wide { grid-column: auto; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .summary-strip { grid-template-columns: repeat(2, 1fr); }
  }

  .admin-register-panel {
    scroll-margin-top: 14px;
  }

  .admin-filter-grid {
    display: grid;
    grid-template-columns:
      minmax(150px, .8fr)
      minmax(280px, 2fr)
      minmax(155px, .9fr)
      minmax(140px, .8fr);
    gap: 10px;
    align-items: end;
    padding: 14px;
    margin: 12px 0;
    background: var(--light);
    border: 1px solid var(--border);
    border-radius: 9px;
  }

  .admin-filter-grid label {
    margin-bottom: 0;
  }

  .admin-filter-actions {
    display: flex;
    gap: 8px;
    align-items: end;
    padding-bottom: 1px;
  }

  .admin-filter-actions button {
    flex: 1;
  }

  .register-table {
    min-width: 1780px;
  }

  .register-table th {
    position: sticky;
    top: 0;
    z-index: 2;
    white-space: nowrap;
  }

  .register-table td {
    white-space: nowrap;
  }

  .register-table .fmr-cell,
  .register-table .notes-cell {
    white-space: normal;
    min-width: 170px;
  }

  .register-table .numeric {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .register-empty {
    padding: 24px 12px;
    text-align: center;
    color: var(--muted);
  }

  .register-meta {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    color: var(--muted);
    font-size: 12px;
    margin: 8px 0 10px;
  }

  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-top: 14px;
  }

  .register-page-text {
    min-width: 220px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    padding: 4px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    background: #e8eef4;
    color: var(--text);
    white-space: nowrap;
  }

  .status-badge.status-issued,
  .status-badge.status-located {
    background: #dcfae6;
    color: var(--success);
  }

  .status-badge.status-partial,
  .status-badge.status-sourcing {
    background: #fff1cc;
    color: var(--warning);
  }

  .status-badge.status-hold,
  .status-badge.status-cancelled {
    background: #fee4e2;
    color: var(--danger);
  }

  .admin-detail-panel {
    border-left: 5px solid var(--blue);
    scroll-margin-top: 14px;
  }

  .admin-detail-meta {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 8px;
    margin-bottom: 12px;
  }

  .admin-detail-meta > div {
    padding: 10px;
    background: var(--light);
    border-radius: 7px;
  }

  .admin-detail-meta .label {
    display: block;
    color: var(--muted);
    font-size: 11px;
    margin-bottom: 3px;
  }

  .admin-detail-meta .value {
    display: block;
    font-size: 13px;
    font-weight: 800;
    overflow-wrap: anywhere;
  }

  .admin-detail-table {
    min-width: 1420px;
  }

  .kpi.kpi-attention {
    border-color: #f1c56a;
    background: #fffaf0;
  }

  .kpi.kpi-positive {
    border-color: #a9dfbf;
    background: #f4fff8;
  }


  @media (max-width: 950px) {
    .admin-filter-grid {
      grid-template-columns: 1fr 1fr;
    }
  }

  @media (max-width: 680px) {
    .admin-filter-grid {
      grid-template-columns: 1fr;
    }

    .admin-filter-actions {
      width: 100%;
    }

    .pagination {
      flex-wrap: wrap;
    }
  }
  .admin-workspace {
  display: grid;
  grid-template-columns:
    minmax(0, 1fr)
    minmax(320px, 370px);
  gap: 16px;
  align-items: start;
}

.admin-main-column {
  min-width: 0;
}

.admin-operational-rail {
  position: sticky;
  top: 14px;
  align-self: start;
  max-height: calc(100vh - 28px);
  overflow-y: auto;
  padding-right: 2px;
}

.rail-panel {
  padding: 16px;
}

.rail-panel h2 {
  font-size: 18px;
  margin-bottom: 4px;
}

.rail-panel .section-heading p {
  margin-bottom: 0;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.45;
}

.rail-summary {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 10px;
  margin: 12px 0 10px;
  border-radius: 7px;
  background: var(--light);
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
}

.active-bag-item {
  border: 1px solid var(--border);
  border-left: 4px solid var(--blue);
  border-radius: 9px;
  padding: 12px;
  margin-bottom: 10px;
  background: white;
}

.active-bag-heading {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 8px;
}

.active-bag-fmr {
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
}

.readiness-badge {
  display: inline-flex;
  padding: 4px 7px;
  border-radius: 999px;
  white-space: nowrap;
  font-size: 10px;
  font-weight: 800;
}

.readiness-ready {
  background: #dcfae6;
  color: var(--success);
}

.readiness-partial {
  background: #fff1cc;
  color: var(--warning);
}

.active-bag-details {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  margin-top: 10px;
}

.active-bag-details > div {
  padding: 7px;
  border-radius: 6px;
  background: var(--light);
}

.active-bag-details .label {
  display: block;
  margin-bottom: 2px;
  color: var(--muted);
  font-size: 9px;
  font-weight: 800;
  text-transform: uppercase;
}

.active-bag-details span:last-child {
  display: block;
  color: var(--text);
  font-size: 11px;
  font-weight: 800;
  overflow-wrap: anywhere;
}

.active-bag-details .active-bag-remaining {
  grid-column: span 2;
  background: #fffaf0;
  border: 1px solid #f1c56a;
}

.active-bag-audit,
.active-bag-notes {
  margin-top: 8px;
  font-size: 10px;
  line-height: 1.4;
}

.active-bag-audit {
  color: var(--muted);
}

.active-bag-notes {
  padding: 7px;
  border-radius: 6px;
  background: #f8fafc;
  color: var(--text);
}

@media (max-width: 1150px) {
  .admin-workspace {
    grid-template-columns: 1fr;
  }

  .admin-operational-rail {
    position: static;
    max-height: none;
    overflow: visible;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
}

@media (max-width: 760px) {
  .admin-operational-rail {
    grid-template-columns: 1fr;
  }

  .active-bag-details {
    grid-template-columns: 1fr;
  }

  .active-bag-details .active-bag-remaining {
    grid-column: auto;
  }
}




.system-control-panel {
  border-top: 5px solid var(--blue);
}

.system-control-overview {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin: 16px 0 8px;
}

.system-control-overview > div {
  display: grid;
  gap: 5px;
  padding: 12px;
  border: 1px solid #d0d5dd;
  border-radius: 10px;
  background: #f8fafc;
}

.system-control-overview .label {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: #667085;
}

.system-environment-badge {
  display: inline-flex;
  width: fit-content;
  align-items: center;
  padding: 5px 9px;
  border-radius: 999px;
  font-size: 12px;
}

.system-environment-badge.is-enabled {
  background: #ecfdf3;
  color: #027a48;
}

.system-environment-badge.is-read-only {
  background: #fff4ed;
  color: #b93815;
}

.system-control-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 16px;
  margin-top: 16px;
}

.system-control-card {
  padding: 16px;
  border: 1px solid #d0d5dd;
  border-radius: 10px;
  background: #ffffff;
}

.system-control-card h3,
.system-user-register h3 {
  margin: 0;
}

.system-user-register {
  margin-top: 18px;
}

.system-user-table-wrap {
  overflow-x: auto;
  border: 1px solid #d0d5dd;
  border-radius: 10px;
}

.system-user-table {
  width: 100%;
  min-width: 920px;
  border-collapse: collapse;
}

.system-user-table th,
.system-user-table td {
  padding: 10px 12px;
  border-bottom: 1px solid #eaecf0;
  text-align: left;
  vertical-align: top;
}

.system-user-table th {
  background: #f8fafc;
  font-size: 10px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #475467;
}

.system-user-table tr:last-child td {
  border-bottom: 0;
}

.system-user-table tr.is-inactive {
  opacity: 0.62;
  background: #f9fafb;
}

.system-permission-chip {
  display: inline-flex;
  margin: 0 4px 4px 0;
  padding: 3px 7px;
  border-radius: 999px;
  background: #eff8ff;
  color: #175cd3;
  font-size: 10px;
  font-weight: 800;
}

.system-user-status {
  display: inline-flex;
  padding: 4px 8px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 900;
}

.system-user-status.is-active {
  background: #ecfdf3;
  color: #027a48;
}

.system-user-status.is-inactive {
  background: #f2f4f7;
  color: #475467;
}

.system-user-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

button.small {
  padding: 6px 9px;
  font-size: 11px;
}

button.danger {
  border-color: #d92d20;
  background: #d92d20;
  color: #ffffff;
}

button.danger:hover {
  background: #b42318;
}

body[data-transaction-mode="READ_ONLY"] .topbar {
  box-shadow: inset 0 -4px 0 #f79009;
}

@media (max-width: 900px) {
  .system-control-overview,
  .system-control-grid {
    grid-template-columns: 1fr;
  }
}
/* Sprint 4A medium-width Production Controls fix */
@media (max-width: 1200px) {
  .system-control-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 700px) {
  .system-control-overview {
    grid-template-columns: 1fr;
  }

  .system-control-card .owner-grid {
    grid-template-columns: 1fr;
  }
}


.bulk-import-panel {
  border-top: 5px solid #7f56d9;
}

.bulk-import-source-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
  margin: 16px 0;
}

.bulk-import-source-card,
.bulk-import-workspace,
.bulk-import-actions,
.bulk-import-recent-section {
  padding: 16px;
  border: 1px solid #d0d5dd;
  border-radius: 10px;
  background: #ffffff;
}

.bulk-import-source-card {
  display: grid;
  align-content: start;
  gap: 12px;
}

.bulk-import-source-card h3,
.bulk-import-recent-section h3,
.bulk-import-workspace h3 {
  margin: 0;
}

.bulk-import-source-card p {
  margin: 0;
  color: #475467;
}

.bulk-import-source-card input[type="file"] {
  width: 100%;
}

.bulk-import-rules-card {
  background: #f9f5ff;
}

.bulk-import-rules-card ul {
  margin: 0;
  padding-left: 20px;
  color: #344054;
}

.bulk-import-batch-list {
  display: grid;
  gap: 8px;
}

.bulk-import-batch-card {
  display: grid;
  grid-template-columns: minmax(220px, 2fr) 1fr auto auto;
  gap: 12px;
  align-items: center;
  width: 100%;
  padding: 12px;
  border: 1px solid #d0d5dd;
  border-radius: 8px;
  background: #ffffff;
  color: #101828;
  text-align: left;
}

.bulk-import-batch-card:hover {
  border-color: #7f56d9;
  background: #f9f5ff;
}

.bulk-import-workspace {
  margin-top: 16px;
}

.bulk-import-summary-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(100px, 1fr));
  gap: 8px;
  margin: 14px 0;
}

.bulk-import-summary-card {
  display: grid;
  gap: 4px;
  padding: 10px;
  border: 1px solid #e4e7ec;
  border-radius: 8px;
  background: #f8fafc;
  text-align: center;
}

.bulk-import-summary-card span {
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #667085;
}

.bulk-import-summary-card strong {
  font-size: 20px;
}

.bulk-import-actions {
  margin-bottom: 14px;
  background: #f9fafb;
}

.bulk-import-override-row {
  display: grid;
  grid-template-columns: minmax(260px, 1fr) auto auto;
  gap: 10px;
  align-items: end;
  margin-top: 12px;
}

.bulk-import-table-wrap {
  overflow-x: auto;
  border: 1px solid #d0d5dd;
  border-radius: 10px;
}

.bulk-import-table {
  width: 100%;
  min-width: 1180px;
  border-collapse: collapse;
}

.bulk-import-table th,
.bulk-import-table td {
  padding: 9px 10px;
  border-bottom: 1px solid #eaecf0;
  text-align: left;
  vertical-align: top;
  font-size: 11px;
}

.bulk-import-table th {
  background: #f8fafc;
  color: #475467;
  font-size: 9px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.bulk-import-table tr:last-child td {
  border-bottom: 0;
}

.bulk-import-table tr.is-staged {
  background: #ecfdf3;
}

.bulk-import-status {
  display: inline-flex;
  width: fit-content;
  padding: 4px 8px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 900;
}

.bulk-import-status.is-valid {
  background: #ecfdf3;
  color: #027a48;
}

.bulk-import-status.is-warning {
  background: #fffaeb;
  color: #b54708;
}

.bulk-import-status.is-blocked {
  background: #fef3f2;
  color: #b42318;
}

.bulk-import-issue-preview {
  max-width: 360px;
  margin-top: 5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

@media (max-width: 1200px) {
  .bulk-import-source-grid {
    grid-template-columns: 1fr;
  }

  .bulk-import-batch-card {
    grid-template-columns: 1fr 1fr;
  }
}
