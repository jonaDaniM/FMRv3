<style>
    :root {
      --navy: #143b5d;
      --blue: #266092;
      --light: #eef5fb;
      --border: #d7e2ec;
      --text: #18263a;
      --muted: #66778a;
      --danger: #b42318;
      --success: #176b43;
      --warning: #9a6700;
    }
  
    * { box-sizing: border-box; }
  
    body {
      margin: 0;
      background: #f4f7fa;
      color: var(--text);
      font-family: Arial, sans-serif;
    }
  
    .shell {
      width: min(1500px, 100%);
      margin: 0 auto;
      padding: 22px;
    }
  
    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-start;
      padding: 20px;
      background: var(--navy);
      color: white;
      border-radius: 12px;
      margin-bottom: 18px;
    }
  
    h1, h2, h3, p { margin-top: 0; }
  
    .topbar p {
      margin-bottom: 0;
      opacity: .85;
    }
  
    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
  
    nav a {
      color: white;
      text-decoration: none;
      padding: 9px 13px;
      border-radius: 7px;
      font-weight: 700;
    }
  
    nav a.active,
    nav a:hover {
      background: rgba(255, 255, 255, .18);
    }
  
    .panel,
    .fmr-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(20, 59, 93, .06);
    }
  
    .search-grid {
      display: grid;
      grid-template-columns: 180px minmax(240px, 1fr) 130px;
      gap: 10px;
    }
  
    .owner-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 12px;
    }
  
    .owner-grid .wide { grid-column: span 2; }
  
    label {
      display: grid;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 12px;
    }
  
    input,
    select,
    textarea,
    button {
      font: inherit;
    }
  
    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #b9c8d6;
      border-radius: 7px;
      padding: 10px 11px;
      background: white;
    }
  
    textarea {
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
  
    button {
      border: 0;
      border-radius: 7px;
      padding: 10px 14px;
      background: var(--blue);
      color: white;
      font-weight: 800;
      cursor: pointer;
    }
  
    button.secondary {
      background: #e8eef4;
      color: var(--text);
    }
  
    button.warning { background: #a86f00; }
    button.danger { background: var(--danger); }
  
    button.small {
      padding: 7px 9px;
      font-size: 12px;
    }
  
    button:disabled {
      opacity: .55;
      cursor: wait;
    }
  
    .status,
    .muted {
      color: var(--muted);
      font-size: 13px;
      margin-top: 10px;
    }
  
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
  
    .kpi {
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }
  
    .kpi span { display: block; }
  
    .kpi .label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }
  
    .kpi .value {
      font-size: 22px;
      font-weight: 800;
    }
  
    .summary-strip {
      display: grid;
      grid-template-columns: repeat(8, minmax(85px, 1fr));
      gap: 7px;
      margin: 12px 0;
    }
  
    .summary-cell {
      background: var(--light);
      border-radius: 7px;
      padding: 9px;
      text-align: center;
    }
  
    .summary-cell .label {
      display: block;
      color: var(--muted);
      font-size: 11px;
    }
  
    .summary-cell .value {
      display: block;
      font-weight: 800;
      margin-top: 3px;
    }
  
    .table-wrap { overflow-x: auto; }
  
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1150px;
    }
  
    th,
    td {
      text-align: left;
      padding: 9px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      font-size: 12px;
    }
  
    th { background: var(--light); }
  
    .button-row,
    .material-actions,
    .queue-actions,
    .section-heading {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
  
    .section-heading { justify-content: space-between; }
  
    .queue-item {
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 13px;
      margin-bottom: 10px;
    }
  
    .queue-title {
      font-weight: 800;
      margin-bottom: 5px;
    }
  
    .queue-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
  
    .alert {
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 14px;
    }
  
    .alert.error {
      color: var(--danger);
      background: #fee4e2;
    }
  
    .alert.success {
      color: var(--success);
      background: #dcfae6;
    }
  
    .hidden { display: none !important; }
  
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .65);
      display: grid;
      place-items: center;
      padding: 18px;
      z-index: 1000;
    }
  
    .modal-card {
      position: relative;
      width: min(620px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: white;
      border-radius: 12px;
      padding: 20px;
    }
  
    .icon-button {
      position: absolute;
      top: 12px;
      right: 12px;
      background: transparent;
      color: var(--text);
      font-size: 23px;
      padding: 4px 9px;
    }
  
    @media (max-width: 950px) {
      .kpi-grid { grid-template-columns: repeat(3, 1fr); }
      .summary-strip { grid-template-columns: repeat(4, 1fr); }
      .owner-grid { grid-template-columns: 1fr 1fr; }
      .admin-filter-grid { grid-template-columns: 1fr 1fr; }
    }
  
    @media (max-width: 680px) {
      .shell { padding: 12px; }
      .topbar { flex-direction: column; }
      .search-grid,
      .owner-grid,
      .admin-filter-grid { grid-template-columns: 1fr; }
      .owner-grid .wide { grid-column: auto; }
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .summary-strip { grid-template-columns: repeat(2, 1fr); }
    }
  
    .admin-register-panel {
      scroll-margin-top: 14px;
    }
  
    .admin-filter-grid {
      display: grid;
      grid-template-columns:
        minmax(150px, .8fr)
        minmax(280px, 2fr)
        minmax(155px, .9fr)
        minmax(140px, .8fr);
      gap: 10px;
      align-items: end;
      padding: 14px;
      margin: 12px 0;
      background: var(--light);
      border: 1px solid var(--border);
      border-radius: 9px;
    }
  
    .admin-filter-grid label {
      margin-bottom: 0;
    }
  
    .admin-filter-actions {
      display: flex;
      gap: 8px;
      align-items: end;
      padding-bottom: 1px;
    }
  
    .admin-filter-actions button {
      flex: 1;
    }
  
    .register-table {
      min-width: 1780px;
    }
  
    .register-table th {
      position: sticky;
      top: 0;
      z-index: 2;
      white-space: nowrap;
    }
  
    .register-table td {
      white-space: nowrap;
    }
  
    .register-table .fmr-cell,
    .register-table .notes-cell {
      white-space: normal;
      min-width: 170px;
    }
  
    .register-table .numeric {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
  
    .register-empty {
      padding: 24px 12px;
      text-align: center;
      color: var(--muted);
    }
  
    .register-meta {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 12px;
      margin: 8px 0 10px;
    }
  
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
    }
  
    .register-page-text {
      min-width: 220px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
  
    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      background: #e8eef4;
      color: var(--text);
      white-space: nowrap;
    }
  
    .status-badge.status-issued,
    .status-badge.status-located {
      background: #dcfae6;
      color: var(--success);
    }
  
    .status-badge.status-partial,
    .status-badge.status-sourcing {
      background: #fff1cc;
      color: var(--warning);
    }
  
    .status-badge.status-hold,
    .status-badge.status-cancelled {
      background: #fee4e2;
      color: var(--danger);
    }
  
    .admin-detail-panel {
      border-left: 5px solid var(--blue);
      scroll-margin-top: 14px;
    }
  
    .admin-detail-meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
  
    .admin-detail-meta > div {
      padding: 10px;
      background: var(--light);
      border-radius: 7px;
    }
  
    .admin-detail-meta .label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 3px;
    }
  
    .admin-detail-meta .value {
      display: block;
      font-size: 13px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }
  
    .admin-detail-table {
      min-width: 1420px;
    }
  
    .kpi.kpi-attention {
      border-color: #f1c56a;
      background: #fffaf0;
    }
  
    .kpi.kpi-positive {
      border-color: #a9dfbf;
      background: #f4fff8;
    }
  
  
    @media (max-width: 950px) {
      .admin-filter-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  
    @media (max-width: 680px) {
      .admin-filter-grid {
        grid-template-columns: 1fr;
      }
  
      .admin-filter-actions {
        width: 100%;
      }
  
      .pagination {
        flex-wrap: wrap;
      }
    }
  
  </style>
