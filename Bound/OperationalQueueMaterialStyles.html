<style>
  /*
   * FMR Operations v3 — Alpha 27.1
   * Operational Queue text formatting
   *
   * Complete replacement for:
   * Bound/OperationalQueueMaterialStyles.html
   */

  .admin-operational-rail,
  .admin-operational-rail *,
  .operational-card,
  .operational-card *,
  .operational-item,
  .operational-item * {
    box-sizing: border-box;
  }

  .operational-card,
  .operational-card-heading,
  .operational-card-items,
  .operational-item,
  .operational-item-heading,
  .operational-item-primary,
  .operational-detail-grid,
  .operational-detail-field,
  .operational-text-block,
  .operational-metric-grid,
  .operational-metric {
    min-width: 0;
  }

  .operational-card-actions {
    justify-content: flex-start;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid
      var(--border, #d7e2ec);
  }

  .operational-card-actions button {
    min-width: 124px;
  }

  .operational-card-items {
    display: grid;
    gap: 14px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid
      var(--border, #d7e2ec);
  }

  .operational-item {
    overflow: hidden;
    padding: 14px;
    border: 1px solid
      var(--border, #d7e2ec);
    border-left: 4px solid
      #8eb9da;
    border-radius: 10px;
    background: #ffffff;
  }

  .operational-item-backorder {
    border-left-color: #d6a300;
  }

  .operational-item-bag {
    border-left-color: #2f855a;
  }

  .operational-item-heading {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .operational-item-primary {
    display: grid;
    gap: 4px;
    flex: 1 1 auto;
  }

  .operational-eyebrow,
  .operational-detail-label {
    display: block;
    color: var(--muted, #66778a);
    font-size: 11px;
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: 0.04em;
    text-align: left;
    text-transform: uppercase;
  }

  .operational-commodity-value {
    display: block;
    max-width: 100%;
    color: var(--navy, #143b5d);
    font-size: 17px;
    line-height: 1.3;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .operational-quantity-badge {
    flex: 0 0 auto;
    max-width: 45%;
    padding: 7px 10px;
    border: 1px solid #f1cf74;
    border-radius: 999px;
    background: #fff3cf;
    color: #805700;
    font-size: 12px;
    font-weight: 800;
    line-height: 1.2;
    text-align: center;
    white-space: normal;
  }

  .operational-quantity-badge-ready {
    border-color: #a9dfc2;
    background: #e8f7ef;
    color: #176b43;
  }

  .operational-detail-grid {
    display: grid;
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
    gap: 9px;
    margin-top: 12px;
  }

  .operational-detail-field {
    display: grid;
    align-content: start;
    gap: 5px;
    min-height: 60px;
    padding: 10px 11px;
    border: 1px solid
      #d7e3ee;
    border-radius: 8px;
    background: #f8fbfe;
    text-align: left;
  }

  .operational-detail-field.is-wide {
    grid-column: 1 / -1;
  }

  .operational-detail-value {
    display: block;
    max-width: 100%;
    color: var(--text, #18263a);
    font-size: 14px;
    font-weight: 750;
    line-height: 1.35;
    text-align: left;
    white-space: normal;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .operational-detail-grid
    .operational-detail-field:first-child {
    border-color: #b8d7ed;
    background: #eef7ff;
  }

  .operational-detail-grid
    .operational-detail-field:first-child
    .operational-detail-value {
    color: var(--navy, #143b5d);
    font-size: 16px;
    font-weight: 850;
  }

  /*
   * Compact natural-flow text blocks.
   *
   * These selectors are intentionally more specific than legacy queue
   * selectors so descriptions and reasons cannot inherit centered,
   * vertically stretched, or fixed-height formatting.
   */
  .operational-item .operational-text-block {
    display: block;
    align-content: initial;
    align-items: initial;
    justify-content: initial;
    min-height: 0;
    height: auto;
    max-height: none;
    margin-top: 10px;
    padding: 10px 12px;
    border: 1px solid
      #d7e3ee;
    border-radius: 8px;
    background: #ffffff;
    overflow: visible;
    text-align: left;
  }

  .operational-item
    .operational-text-block.is-emphasis {
    border-color: #c8ddeb;
    border-left: 4px solid #79aed3;
    background: #f5faff;
    padding-left: 12px;
  }

  .operational-item
    .operational-text-block
    .operational-detail-label {
    display: block;
    margin: 0;
    padding: 0;
    text-align: left;
  }

  .operational-item .operational-text-value {
    display: block;
    align-self: auto;
    justify-self: stretch;
    place-self: auto stretch;
    min-height: 0;
    height: auto;
    max-height: none;
    max-width: 100%;
    margin: 5px 0 0;
    padding: 0;
    color: var(--text, #18263a);
    font-size: 14px;
    font-weight: 650;
    line-height: 1.42;
    text-align: left;
    white-space: pre-wrap;
    overflow: visible;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .operational-item
    .operational-text-block.is-emphasis
    .operational-text-value {
    color: var(--navy, #143b5d);
    font-size: 15px;
    font-weight: 760;
    line-height: 1.38;
  }

  .operational-reporting-grid {
    margin-top: 10px;
  }

  .operational-metric-grid {
    display: grid;
    grid-template-columns:
      repeat(3, minmax(0, 1fr));
    gap: 8px;
    margin-top: 10px;
  }

  .operational-metric {
    display: grid;
    align-content: start;
    gap: 5px;
    padding: 10px 8px;
    border: 1px solid
      #d7e3ee;
    border-radius: 8px;
    background: #eef5fb;
    text-align: center;
  }

  .operational-metric
    .operational-detail-label {
    text-align: center;
  }

  .operational-metric strong {
    color: var(--navy, #143b5d);
    font-size: 15px;
    line-height: 1.25;
    overflow-wrap: anywhere;
  }

  .operational-decision-actions {
    display: grid;
    grid-template-columns:
      repeat(3, minmax(0, 1fr));
    gap: 10px;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid
      var(--border, #d7e2ec);
  }

  .operational-decision-actions button {
    width: 100%;
    min-width: 0;
    min-height: 42px;
    padding: 9px 8px;
    line-height: 1.2;
    white-space: normal;
  }

  .operational-read-only-note {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid
      var(--border, #d7e2ec);
    color: var(--muted, #66778a);
    font-size: 13px;
    font-weight: 700;
  }

  @media (max-width: 720px) {
    .operational-item-heading {
      align-items: stretch;
      flex-direction: column;
    }

    .operational-quantity-badge {
      align-self: flex-start;
      max-width: 100%;
    }

    .operational-detail-grid {
      grid-template-columns: 1fr;
    }

    .operational-detail-field.is-wide {
      grid-column: auto;
    }

    .operational-item
      .operational-text-block.is-emphasis
      .operational-text-value {
      font-size: 14px;
    }
  }

  @media (max-width: 520px) {
    .operational-item {
      padding: 12px;
    }

    .operational-metric-grid,
    .operational-decision-actions {
      grid-template-columns: 1fr;
    }

    .operational-card-actions button {
      width: 100%;
    }

    .operational-item .operational-text-block {
      padding: 9px 10px;
    }
  }
</style>
