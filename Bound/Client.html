    async function submitBackorderDecisionV3_(
      requestId,
      decision,
      maximum
    ) {
      let quantity = 0;

      if (decision === 'CONFIRM') {
        const response =
          window.prompt(
            `Quantity to confirm, maximum ${maximum}:`,
            String(maximum)
          );

        if (response == null) {
          return;
        }

        quantity =
          Number(response);

        if (
          !Number.isFinite(quantity) ||
          quantity <= 0 ||
          quantity > maximum
        ) {
          showErrorV3_(
            `Enter a quantity between 0 and ${maximum}.`
          );

          return;
        }
      }

      const notes =
        window.prompt(
          decision === 'RETURN'
            ? (
                'Explain what the Field ' +
                'team should review:'
              )
            : 'Admin notes:',
          ''
        );

      if (
        decision === 'RETURN' &&
        (
          !notes ||
          !notes.trim()
        )
      ) {
        showErrorV3_(
          'A return-for-review reason is required.'
        );

        return;
      }

      try {
        await callServerV3_(
          'reviewBackorderV3',
          {
            requestId,
            decision,
            quantity,
            notes: notes || ''
          }
        );

        showSuccessV3_(
          `Backorder ${
            decision.toLowerCase()
          } completed.`
        );

        await refreshAdminV3_();
      } catch (error) {
        showErrorV3_(error);
      }
    }

    function parseOwnerLinesV3_() {
      const text =
        byId('ownerLines')
          .value
          .trim();

      if (!text) {
        return [];
      }

      return text
        .split(/\r?\n/)
        .filter(Boolean)
        .map((line, index) => {
          const delimiter =
            line.includes('\t')
              ? '\t'
              : ',';

          const parts =
            line
              .split(delimiter)
              .map(
                value =>
                  value.trim()
              );

          if (
            index === 0 &&
            /ISO/i.test(
              parts[0] || ''
            ) &&
            /SHEET/i.test(
              parts[1] || ''
            )
          ) {
            return null;
          }

          return {
            isoNumber:
              parts[0] || '',

            isoSheet:
              parts[1] || '',

            commodityCode:
              parts[2] || '',

            size:
              parts[3] || '',

            description:
              parts[4] || '',

            qtyRequested:
              Number(
                parts[5] || 0
              ),

            uom:
              parts[6] || '',

            storageLocation:
              parts[7] || '',

            notes:
              parts[8] || ''
          };
        })
        .filter(Boolean);
    }

    async function saveStagingV3_() {
      const payload = {
        stagingFmrId:
          state.editingStagingFmrId,

        officialFmrNumber:
          byId('ownerFmrNumber')
            .value
            .trim(),

        iwpNumber:
          byId('ownerIwpNumber')
            .value
            .trim(),

        requestedBy:
          byId('ownerRequestedBy')
            .value
            .trim(),

        dateRequired:
          byId('ownerDateRequired')
            .value,

        priority:
          byId('ownerPriority')
            .value
            .trim(),

        notes:
          byId('ownerNotes')
            .value
            .trim(),

        lines:
          parseOwnerLinesV3_()
      };

      hideAlertsV3_();

      try {
        const result =
          await callServerV3_(
            'saveStagingV3',
            payload
          );

        showSuccessV3_(
          result.valid
            ? 'Staging record saved.'
            : (
                'Saved with validation errors: ' +
                result.validationErrors
                  .join(' | ')
              )
        );

        clearOwnerFormV3_();
        await refreshStagingV3_();
      } catch (error) {
        showErrorV3_(error);
      }
    }

    function clearOwnerFormV3_() {
      state.editingStagingFmrId = '';

      byId(
        'ownerEditStatus'
      ).textContent = '';

      byId(
        'saveStagingButton'
      ).textContent =
        'Save Staging';

      [
        'ownerFmrNumber',
        'ownerIwpNumber',
        'ownerRequestedBy',
        'ownerDateRequired',
        'ownerPriority',
        'ownerNotes',
        'ownerLines'
      ].forEach(id => {
        byId(id).value = '';
      });
    }

    async function refreshStagingV3_() {
      byId('stagingList').innerHTML =
        '<div class="muted">' +
        'Loading staging records…' +
        '</div>';

      try {
        const items =
          await callServerV3_(
            'getStagingListV3',
            100
          );

        renderStagingV3_(
          items || []
        );
      } catch (error) {
        showErrorV3_(error);
      }
    }

    function renderStagingV3_(items) {
      const container =
        byId('stagingList');

      if (!items.length) {
        container.innerHTML =
          '<div class="muted">' +
          'No unpublished staging records.' +
          '</div>';

        return;
      }

      container.innerHTML =
        items.map(item => `
          <article class="queue-item">
            <div class="queue-title">
              ${
                escapeHtmlV3_(
                  item.officialFmrNumber ||
                  item.stagingFmrId
                )
              }
            </div>

            <div class="queue-meta">
              IWP
              ${
                escapeHtmlV3_(
                  item.iwpNumber
                )
              } ·

              ${
                escapeHtmlV3_(
                  item.status
                )
              } ·

              ${
                escapeHtmlV3_(
                  item.updatedAt
                )
              }

              ${
                item.validationErrors
                  ? `
                    <br>
                    ${
                      escapeHtmlV3_(
                        item.validationErrors
                      )
                    }
                  `
                  : ''
              }
            </div>

            <div class="queue-actions">
              <button
                class="small secondary"
                data-edit-staging="${
                  escapeAttributeV3_(
                    item.stagingFmrId
                  )
                }">

                Edit
              </button>

              <button
                class="small"
                data-publish-staging="${
                  escapeAttributeV3_(
                    item.stagingFmrId
                  )
                }"
                ${
                  item.validationErrors
                    ? 'disabled'
                    : ''
                }>

                Publish
              </button>
            </div>
          </article>
        `).join('');

      container
        .querySelectorAll(
          '[data-edit-staging]'
        )
        .forEach(button => {
          button.addEventListener(
            'click',
            () => {
              loadStagingForEditV3_(
                button.dataset
                  .editStaging
              );
            }
          );
        });

      container
        .querySelectorAll(
          '[data-publish-staging]'
        )
        .forEach(button => {
          button.addEventListener(
            'click',
            () => {
              publishStagingV3_(
                button.dataset
                  .publishStaging
              );
            }
          );
        });
    }

    async function loadStagingForEditV3_(
      stagingFmrId
    ) {
      try {
        const staged =
          await callServerV3_(
            'getStagedFmrV3',
            stagingFmrId
          );

        const header =
          staged.header || {};

        state.editingStagingFmrId =
          header.stagingFmrId ||
          stagingFmrId;

        byId(
          'ownerFmrNumber'
        ).value =
          header.officialFmrNumber ||
          '';

        byId(
          'ownerIwpNumber'
        ).value =
          header.iwpNumber || '';

        byId(
          'ownerRequestedBy'
        ).value =
          header.requestedBy || '';

        byId(
          'ownerDateRequired'
        ).value =
          header.dateRequired || '';

        byId(
          'ownerPriority'
        ).value =
          header.priority || '';

        byId(
          'ownerNotes'
        ).value =
          header.notes || '';

        byId(
          'ownerLines'
        ).value =
          (staged.lines || [])
            .map(line => [
              line.isoNumber,
              line.isoSheet,
              line.commodityCode,
              line.size,
              line.description,
              line.qtyRequested,
              line.uom,
              line.storageLocation,
              line.notes
            ]
              .map(
                value =>
                  value == null
                    ? ''
                    : String(value)
              )
              .join('\t')
            )
            .join('\n');

        byId(
          'ownerEditStatus'
        ).textContent =
          `Editing ${
            state.editingStagingFmrId
          }`;

        byId(
          'saveStagingButton'
        ).textContent =
          'Update Staging';

        window.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
      } catch (error) {
        showErrorV3_(error);
      }
    }

    async function renumberPublishedFmrV3_() {
      const currentFmrNumber =
        byId(
          'renumberCurrentFmr'
        )
          .value
          .trim();

      const newFmrNumber =
        byId(
          'renumberNewFmr'
        )
          .value
          .trim();

      const reason =
        byId(
          'renumberReason'
        )
          .value
          .trim();

      if (
        !currentFmrNumber ||
        !newFmrNumber ||
        !reason
      ) {
        showErrorV3_(
          'Current FMR Number, New FMR Number, and Reason are required.'
        );

        return;
      }

      if (
        !window.confirm(
          `Renumber ${
            currentFmrNumber
          } to ${
            newFmrNumber
          }?`
        )
      ) {
        return;
      }

      try {
        const result =
          await callServerV3_(
            'renumberPublishedFmrByNumberV3',
            currentFmrNumber,
            newFmrNumber,
            reason
          );

        showSuccessV3_(
          `Renumbered ${
            result.oldFmrNumber
          } to ${
            result.newFmrNumber
          }.`
        );

        [
          'renumberCurrentFmr',
          'renumberNewFmr',
          'renumberReason'
        ].forEach(id => {
          byId(id).value = '';
        });
      } catch (error) {
        showErrorV3_(error);
      }
    }

    async function publishStagingV3_(
      stagingFmrId
    ) {
      if (
        !window.confirm(
          'Publish this FMR to the operational database?'
        )
      ) {
        return;
      }

      try {
        const result =
          await callServerV3_(
            'publishStagedFmrV3',
            stagingFmrId
          );

        showSuccessV3_(
          result.message
        );

        await refreshStagingV3_();
      } catch (error) {
        showErrorV3_(error);
      }
    }

    function actionLabelV3_(action) {
      const labels = {
        CONFIRM_AVAILABLE:
          'Confirm Available',

        BAG:
          'Bag & Tag',

        DIRECT_ISSUE:
          'Locate & Issue',

        ISSUE_FROM_AVAILABLE:
          'Issue Available',

        ISSUE_FROM_BAG:
          'Issue From Bag',

        BACKORDER_REQUESTED:
          'Submit Backorder'
      };

      return labels[action] || action;
    }

    function setBusyV3_(busy) {
      state.busy =
        Boolean(busy);

      byId(
        'searchButton'
      ).disabled =
        state.busy;
    }

    function numberValueV3_(id) {
      const element =
        byId(id);

      return element
        ? Number(
            element.value || 0
          )
        : 0;
    }

    function valueOfV3_(id) {
      const element =
        byId(id);

      return element
        ? element.value.trim()
        : '';
    }

    function formatQtyV3_(value) {
      const number =
        Number(value || 0);

      return Number.isInteger(number)
        ? String(number)
        : number.toFixed(2);
    }

    function escapeHtmlV3_(value) {
      return String(
        value == null
          ? ''
          : value
      )
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeAttributeV3_(value) {
      return escapeHtmlV3_(value);
    }

    function hideAlertsV3_() {
      byId(
        'globalError'
      )
        .classList
        .add('hidden');

      byId(
        'globalSuccess'
      )
        .classList
        .add('hidden');
    }

    function showErrorV3_(error) {
      const message =
        error && error.message
          ? error.message
          : String(error);

      byId(
        'globalError'
      ).textContent =
        message;

      byId(
        'globalError'
      )
        .classList
        .remove('hidden');

      byId(
        'globalSuccess'
      )
        .classList
        .add('hidden');
    }

    function showSuccessV3_(message) {
      byId(
        'globalSuccess'
      ).textContent =
        String(
          message || 'Completed.'
        );

      byId(
        'globalSuccess'
      )
        .classList
        .remove('hidden');

      byId(
        'globalError'
      )
        .classList
        .add('hidden');
    }

    function callServerV3_(
      functionName,
      ...args
    ) {
      return new Promise(
        (resolve, reject) => {
          const runner =
            google.script.run
              .withSuccessHandler(
                resolve
              )
              .withFailureHandler(
                reject
              );

          runner[functionName](
            ...args
          );
        }
      );
    }
  })();
</script>
