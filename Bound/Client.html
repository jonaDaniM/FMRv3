<script>
  (() => {
    'use strict';

    const state = {
      bootstrap: null,
      fieldData: null,
      activeAction: '',
      activeCard: null,
      activeMaterial: null,
      activeWorkflowAction: null,
      editingStagingFmrId: '',
      adminRegisterPage: 1,
      adminRegisterPageSize: 25,
      adminRegisterData: null,
      fieldExpandedLineIds: new Set(),
      fieldFilterValues: {},
      fieldSearchSequence: 0,
      fieldTransactionBusy: false,
      lastFieldQuery: '',
      lastFieldMode: '',
      busy: false
    };

    const byId = id => document.getElementById(id);

    document.addEventListener('DOMContentLoaded', initializePortalV3_);

    function initializePortalV3_() {
      activateRequestedViewV3_();
      bindPortalEventsV3_();

      callServerV3_('getPortalBootstrapV3')
        .then(bootstrap => {
          state.bootstrap = bootstrap;

          byId('pageSubtitle').textContent =
            `${bootstrap.user.name || bootstrap.user.email} · ` +
            `${bootstrap.user.role} · FMRCore ${bootstrap.version}`;

          if (REQUESTED_VIEW === 'admin') {
            refreshAdminV3_();
          } else if (REQUESTED_VIEW === 'owner') {
            refreshStagingV3_();
          }
        })
        .catch(showErrorV3_);
    }

    function activateRequestedViewV3_() {
      ['field', 'admin', 'owner'].forEach(view => {
        byId(`${view}View`).classList.toggle(
          'hidden',
          REQUESTED_VIEW !== view
        );

        byId(`${view}Nav`).classList.toggle(
          'active',
          REQUESTED_VIEW === view
        );
      });
    }

    function bindPortalEventsV3_() {
      byId('searchButton').addEventListener(
        'click',
        searchFieldV3_
      );

      byId('searchQuery').addEventListener(
        'keydown',
        event => {
          if (event.key === 'Enter') {
            searchFieldV3_();
          }
        }
      );

      byId('adminRefreshButton').addEventListener(
        'click',
        refreshAdminV3_
      );

      byId('adminRegisterSearchButton').addEventListener(
        'click',
        () => {
          state.adminRegisterPage = 1;
          refreshAdminRegisterV3_();
        }
      );

      byId('adminRegisterResetButton').addEventListener(
        'click',
        resetAdminRegisterV3_
      );

      byId('adminRegisterQuery').addEventListener(
        'keydown',
        event => {
          if (event.key === 'Enter') {
            state.adminRegisterPage = 1;
            refreshAdminRegisterV3_();
          }
        }
      );

      byId('adminRegisterPreviousButton').addEventListener(
        'click',
        () => {
          if (state.adminRegisterPage > 1) {
            state.adminRegisterPage -= 1;
            refreshAdminRegisterV3_();
          }
        }
      );

      byId('adminRegisterNextButton').addEventListener(
        'click',
        () => {
          const pagination =
            state.adminRegisterData?.pagination || {};

          if (pagination.hasNext) {
            state.adminRegisterPage += 1;
            refreshAdminRegisterV3_();
          }
        }
      );

      byId('adminFmrDetailCloseButton').addEventListener(
        'click',
        closeAdminFmrDetailV3_
      );

      byId('saveStagingButton').addEventListener(
        'click',
        saveStagingV3_
      );

      byId('ownerClearButton').addEventListener(
        'click',
        clearOwnerFormV3_
      );

      byId('ownerRefreshButton').addEventListener(
        'click',
        refreshStagingV3_
      );

      byId('renumberButton').addEventListener(
        'click',
        renumberPublishedFmrV3_
      );

      byId('modalClose').addEventListener(
        'click',
        closeActionModalV3_
      );

      byId('modalCancel').addEventListener(
        'click',
        closeActionModalV3_
      );

      byId('actionModal').addEventListener(
        'click',
        event => {
          if (event.target === byId('actionModal')) {
            closeActionModalV3_();
          }
        }
      );

      byId('actionForm').addEventListener(
        'submit',
        submitFieldActionV3_
      );
    }

    async function searchFieldV3_() {
      return runFieldSearchV3_({
        preserveView:
          false,

        silent:
          false
      });
    }

    async function runFieldSearchV3_(
      options
    ) {
      const settings =
        options || {};

      const query =
        byId(
          'searchQuery'
        ).value.trim();

      const mode =
        byId(
          'searchMode'
        ).value;

      if (!query) {
        byId(
          'fieldStatus'
        ).textContent =
          'Enter an FMR number or a combined ISO and sheet.';

        return null;
      }

      if (
        settings.preserveView
      ) {
        captureFieldViewStateV3_();
      } else if (
        query !==
          state.lastFieldQuery ||
        mode !==
          state.lastFieldMode
      ) {
        state
          .fieldExpandedLineIds
          .clear();

        state.fieldFilterValues =
          {};
      }

      if (
        !settings.silent
      ) {
        hideAlertsV3_();

        byId(
          'fieldStatus'
        ).textContent =
          'Loading indexed records…';

        setBusyV3_(
          true
        );
      }

      const sequence =
        state.fieldSearchSequence +
        1;

      state.fieldSearchSequence =
        sequence;

      try {
        const data =
          await callServerV3_(
            'searchPortalV3',
            query,
            mode
          );

        if (
          sequence !==
          state.fieldSearchSequence
        ) {
          return null;
        }

        state.fieldData =
          data;

        state.lastFieldQuery =
          query;

        state.lastFieldMode =
          mode;

        byId(
          'fieldStatus'
        ).textContent =
          (
            `${data.resultCount} matching FMR(s) · ` +
            `${data.generatedAt}`
          );

        renderFieldResultsV3_(
          data.cards || []
        );

        return data;
      } catch (
        error
      ) {
        if (
          settings.silent
        ) {
          byId(
            'fieldStatus'
          ).textContent =
            (
              'The transaction was saved, but automatic verification ' +
              'did not finish. Run Search to refresh the indexed state.'
            );

          console.error(
            error
          );

          return null;
        }

        byId(
          'fieldStatus'
        ).textContent =
          '';

        showErrorV3_(
          error
        );

        throw error;
      } finally {
        if (
          !settings.silent
        ) {
          setBusyV3_(
            false
          );
        }
      }
    }
    function renderFieldResultsV3_(cards) {
      const container =
        byId('fieldResults');

      if (!cards.length) {
        container.innerHTML =
          '<section class="panel">' +
          'No matching published FMR was found.' +
          '</section>';

        return;
      }

      container.innerHTML =
        cards.map(card => {
          const materials =
            card.materials || [];

          return `
            <article
              class="fmr-card field-fmr-card"
              data-field-fmr-card
              data-field-fmr-number="${
                escapeAttributeV3_(
                  card.fmrNumber
                )
              }">

              <div class="section-heading field-fmr-heading">
                <div>
                  <h3>
                    ${escapeHtmlV3_(card.fmrNumber)}
                  </h3>

                  <div class="muted">
                    IWP ${escapeHtmlV3_(card.iwpNumber)} ·
                    ${escapeHtmlV3_(card.status)}

                    ${card.requestedBy
                      ? ` · Requested by ${escapeHtmlV3_(
                          card.requestedBy
                        )}`
                      : ''}
                  </div>
                </div>

                <div class="field-fmr-tools">
                  <label class="field-material-filter">
                    <span>Filter materials</span>

                    <input
                      type="search"
                      data-field-material-filter
                      placeholder="Description, code, ISO or tag"
                      autocomplete="off">
                  </label>

                  <div
                    class="field-fmr-line-count"
                    data-field-visible-count
                    data-total-lines="${
                      escapeAttributeV3_(
                        materials.length
                      )
                    }">

                    ${materials.length}
                    material line${
                      materials.length === 1
                        ? ''
                        : 's'
                    }
                  </div>
                </div>
              </div>

              ${renderSummaryV3_(
                card.totals || {}
              )}

              <div class="field-material-list">
                ${materials
                  .map(
                    material =>
                      renderFieldMaterialCardV3_(
                        material
                      )
                  )
                  .join('')}
              </div>

              <div
                class="field-material-filter-empty"
                data-field-filter-empty
                hidden>

                No material lines match this filter.
              </div>
            </article>
          `;
        }).join('');

      container
        .querySelectorAll(
          '[data-field-action]'
        )
        .forEach(button => {
          button.addEventListener(
            'click',
            () => {
              const match =
                findMaterialV3_(
                  button.dataset.lineId
                );

              const workflowAction =
                findWorkflowActionV3_(
                  match.material,
                  button.dataset.fieldAction
                );

              openActionModalV3_(
                button.dataset.fieldAction,
                match.card,
                match.material,
                workflowAction
              );
            }
          );
        });

      container
        .querySelectorAll(
          '[data-field-line-toggle]'
        )
        .forEach(button => {
          button.addEventListener(
            'click',
            () => {
              toggleFieldLineV3_(
                button
              );
            }
          );
        });

      container
        .querySelectorAll(
          '[data-field-material-filter]'
        )
        .forEach(input => {
          input.addEventListener(
            'input',
            () => {
              applyFieldMaterialFilterV3_(
                input
              );
            }
          );
        });

      restoreFieldViewStateV3_();
    }

    function toggleFieldLineV3_(
      button
    ) {
      const card =
        button.closest(
          '[data-field-line-id]'
        );

      if (!card) {
        return;
      }

      const expanded =
        card.querySelector(
          '[data-field-line-expanded]'
        );

      if (!expanded) {
        return;
      }

      setFieldLineExpandedV3_(
        card,
        expanded.hasAttribute(
          'hidden'
        )
      );
    }

    function setFieldLineExpandedV3_(
      card,
      expanded
    ) {
      if (!card) {
        return;
      }

      const lineId =
        String(
          card.dataset
            .fieldLineId ||
          ''
        );

      const detail =
        card.querySelector(
          '[data-field-line-expanded]'
        );

      const button =
        card.querySelector(
          '[data-field-line-toggle]'
        );

      if (!detail) {
        return;
      }

      if (expanded) {
        detail.removeAttribute(
          'hidden'
        );

        state
          .fieldExpandedLineIds
          .add(
            lineId
          );
      } else {
        detail.setAttribute(
          'hidden',
          ''
        );

        state
          .fieldExpandedLineIds
          .delete(
            lineId
          );
      }

      card.classList.toggle(
        'is-expanded',
        expanded
      );

      if (!button) {
        return;
      }

      button.setAttribute(
        'aria-expanded',
        String(
          expanded
        )
      );

      const label =
        button.querySelector(
          '[data-field-toggle-label]'
        );

      if (label) {
        label.textContent =
          expanded
            ? (
                button.dataset
                  .expandedLabel ||
                'Hide details'
              )
            : (
                button.dataset
                  .collapsedLabel ||
                'Details'
              );
      }
    }

    function fieldFmrViewKeyV3_(
      card
    ) {
      return String(
        card &&
        card.dataset
          ? (
              card.dataset
                .fieldFmrNumber ||
              ''
            )
          : ''
      );
    }

    function captureFieldViewStateV3_() {
      const container =
        byId(
          'fieldResults'
        );

      if (!container) {
        return;
      }

      container
        .querySelectorAll(
          '[data-field-line-id]'
        )
        .forEach(
          card => {
            const detail =
              card.querySelector(
                '[data-field-line-expanded]'
              );

            if (
              detail &&
              !detail.hasAttribute(
                'hidden'
              )
            ) {
              state
                .fieldExpandedLineIds
                .add(
                  card.dataset
                    .fieldLineId
                );
            }
          }
        );

      container
        .querySelectorAll(
          '[data-field-material-filter]'
        )
        .forEach(
          input => {
            const card =
              input.closest(
                '[data-field-fmr-card]'
              );

            const key =
              fieldFmrViewKeyV3_(
                card
              );

            if (key) {
              state.fieldFilterValues[
                key
              ] =
                input.value || '';
            }
          }
        );
    }

    function restoreFieldViewStateV3_() {
      const container =
        byId(
          'fieldResults'
        );

      if (!container) {
        return;
      }

      container
        .querySelectorAll(
          '[data-field-line-id]'
        )
        .forEach(
          card => {
            setFieldLineExpandedV3_(
              card,
              state
                .fieldExpandedLineIds
                .has(
                  card.dataset
                    .fieldLineId
                )
            );
          }
        );

      container
        .querySelectorAll(
          '[data-field-material-filter]'
        )
        .forEach(
          input => {
            const card =
              input.closest(
                '[data-field-fmr-card]'
              );

            const key =
              fieldFmrViewKeyV3_(
                card
              );

            const value =
              key
                ? (
                    state
                      .fieldFilterValues[
                        key
                      ] || ''
                  )
                : '';

            input.value =
              value;

            applyFieldMaterialFilterV3_(
              input
            );
          }
        );
    }
    function applyFieldMaterialFilterV3_(
      input
    ) {
      const card =
        input.closest(
          '[data-field-fmr-card]'
        );

      if (!card) {
        return;
      }

      const query =
        String(
          input.value || ''
        )
          .trim()
          .toLowerCase();

      const key =
        fieldFmrViewKeyV3_(
          card
        );

      if (key) {
        state.fieldFilterValues[
          key
        ] =
          input.value || '';
      }

      const lines =
        Array.from(
          card.querySelectorAll(
            '[data-field-line-id]'
          )
        );

      let visibleCount = 0;

      lines.forEach(line => {
        const searchable =
          String(
            line.dataset
              .fieldSearchText ||
            ''
          ).toLowerCase();

        const visible =
          !query ||
          searchable.includes(
            query
          );

        line.hidden =
          !visible;

        if (visible) {
          visibleCount += 1;
        }
      });

      const count =
        card.querySelector(
          '[data-field-visible-count]'
        );

      if (count) {
        const total =
          Number(
            count.dataset.totalLines ||
            lines.length
          );

        count.textContent =
          query
            ? (
                `${visibleCount} of ${total} ` +
                `material line${
                  total === 1
                    ? ''
                    : 's'
                }`
              )
            : (
                `${total} material line${
                  total === 1
                    ? ''
                    : 's'
                }`
              );
      }

      const empty =
        card.querySelector(
          '[data-field-filter-empty]'
        );

      if (empty) {
        empty.hidden =
          visibleCount > 0;
      }
    }

    function renderSummaryV3_(totals) {
      const values = [
        ['Requested', totals.requested],
        ['Located', totals.located],
        ['Bagged', totals.bagged],
        ['Available', totals.available],
        ['Issued', totals.issued],
        [
          'Pending B/O',
          totals.pendingBackorder
        ],
        [
          'Confirmed B/O',
          totals.confirmedBackorder
        ],
        ['Remaining', totals.remaining]
      ];

      return `
        <div class="summary-strip">
          ${values.map(item => `
            <div class="summary-cell">
              <span class="label">
                ${escapeHtmlV3_(item[0])}
              </span>

              <span class="value">
                ${formatQtyV3_(item[1])}
              </span>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderFieldMaterialCardV3_(
      material
    ) {
      const workflow =
        fieldWorkflowForMaterialV3_(
          material
        );

      const returnedReviews =
        material.returnedBackorders || [];

      const activeBags =
        material.activeBags || [];

      const actionCount =
        Number(
          workflow.availableActionCount ||
          (workflow.actions || []).length ||
          0
        );

      const primaryQuantities = [
        [
          'Remaining',
          material.qtyRemainingRequirement,
          'field-primary-remaining'
        ],
        [
          'Available',
          material.qtyAvailable,
          'field-primary-available'
        ],
        [
          'Reserved',
          material.qtyActiveBagged,
          'field-primary-reserved'
        ],
        [
          'Issued',
          material.qtyIssued,
          'field-primary-issued'
        ]
      ];

      const detailQuantities = [
        [
          'Requested',
          material.qtyRequested,
          ''
        ],
        [
          'Located',
          material.qtyConfirmedLocated,
          ''
        ],
        [
          'Not Located',
          material.qtyNotYetLocated,
          'field-qty-attention'
        ],
        [
          'Pending B/O',
          material.qtyPendingBackorder,
          'field-qty-attention'
        ],
        [
          'Confirmed B/O',
          material.qtyConfirmedBackorder,
          'field-qty-attention'
        ]
      ];

      const description =
        material.description ||
        material.commodityCode ||
        'Material line';

      const collapsedLabel =
        actionCount > 0
          ? (
              `Actions (${actionCount})`
            )
          : 'Details';

      const searchText = [
        material.description,
        material.commodityCode,
        material.size,
        material.isoKey,
        material.lineNumber,
        material.lineStatus,
        material.storageLocation
      ].concat(
        activeBags.map(
          bag =>
            [
              bag.tagNumber,
              bag.storageLocation
            ].join(' ')
        )
      ).filter(Boolean).join(' ');

      return `
        <article
          class="field-line-card ${
            workflowPhaseClassV3_(
              workflow.phase
            )
          }"
          data-field-line-id="${
            escapeAttributeV3_(
              material.fmrLineId
            )
          }"
          data-field-search-text="${
            escapeAttributeV3_(
              searchText
            )
          }">

          <div class="field-line-compact">
            <div class="field-line-identity">
              <div class="field-line-kicker">
                Line ${
                  escapeHtmlV3_(
                    material.lineNumber
                  )
                } · ISO ${
                  escapeHtmlV3_(
                    material.isoKey
                  )
                }
              </div>

              <h4 class="field-line-description-title">
                ${
                  escapeHtmlV3_(
                    description
                  )
                }
              </h4>

              <div class="field-line-chip-row">
                <span class="field-line-chip field-line-code-chip">
                  ${
                    escapeHtmlV3_(
                      material.commodityCode ||
                      'No commodity code'
                    )
                  }
                </span>

                ${
                  material.size
                    ? `
                      <span class="field-line-chip">
                        Size ${
                          escapeHtmlV3_(
                            material.size
                          )
                        }
                      </span>
                    `
                    : ''
                }

                ${
                  activeBags.length
                    ? `
                      <span class="field-line-chip field-line-tag-chip">
                        ${
                          activeBags.length
                        }
                        active tag${
                          activeBags.length === 1
                            ? ''
                            : 's'
                        }
                      </span>
                    `
                    : ''
                }
              </div>
            </div>

            <div class="field-line-primary-quantities">
              ${primaryQuantities.map(item => `
                <div
                  class="field-primary-qty ${
                    escapeAttributeV3_(
                      item[2]
                    )
                  }">

                  <span>
                    ${
                      escapeHtmlV3_(
                        item[0]
                      )
                    }
                  </span>

                  <strong>
                    ${
                      formatQtyV3_(
                        item[1]
                      )
                    }

                    <small>
                      ${
                        escapeHtmlV3_(
                          material.uom
                        )
                      }
                    </small>
                  </strong>
                </div>
              `).join('')}
            </div>

            <div class="field-line-compact-side">
              <span
                class="status-badge ${
                  statusClassV3_(
                    material.lineStatus
                  )
                }">

                ${
                  escapeHtmlV3_(
                    material.lineStatus
                  )
                }
              </span>

              <button
                type="button"
                class="field-line-toggle"
                data-field-line-toggle
                data-collapsed-label="${
                  escapeAttributeV3_(
                    collapsedLabel
                  )
                }"
                data-expanded-label="Hide details"
                aria-expanded="false">

                <span data-field-toggle-label>
                  ${
                    escapeHtmlV3_(
                      collapsedLabel
                    )
                  }
                </span>

                <span
                  class="field-line-toggle-chevron"
                  aria-hidden="true">

                  ▾
                </span>
              </button>
            </div>
          </div>

          <div
            class="field-workflow-compact ${
              workflowPhaseClassV3_(
                workflow.phase
              )
            }">

            <span class="field-workflow-compact-label">
              Next
            </span>

            <strong>
              ${
                escapeHtmlV3_(
                  workflow.headline ||
                  'Review the material line.'
                )
              }
            </strong>
          </div>

          <div
            class="field-line-expanded"
            data-field-line-expanded
            hidden>

            ${
              returnedReviews.length
                ? `
                  <div class="field-review-alert">
                    <strong>
                      Field review required
                    </strong>

                    ${returnedReviews.map(item => `
                      <div>
                        ${
                          escapeHtmlV3_(
                            item.reason ||
                            item.returnedReviewReason ||
                            'Admin returned this request for review.'
                          )
                        }
                      </div>
                    `).join('')}
                  </div>
                `
                : ''
            }

            <div class="field-line-detail-grid">
              ${detailQuantities.map(item => `
                <div
                  class="field-qty-cell ${
                    escapeAttributeV3_(
                      item[2]
                    )
                  }">

                  <span>
                    ${
                      escapeHtmlV3_(
                        item[0]
                      )
                    }
                  </span>

                  <strong>
                    ${
                      formatQtyV3_(
                        item[1]
                      )
                    }

                    <small>
                      ${
                        escapeHtmlV3_(
                          material.uom
                        )
                      }
                    </small>
                  </strong>
                </div>
              `).join('')}
            </div>

            <div class="field-line-meta">
              <div>
                <span>Storage</span>

                <strong>
                  ${
                    escapeHtmlV3_(
                      material.storageLocation ||
                      'Not recorded'
                    )
                  }
                </strong>
              </div>

              <div>
                <span>Line identifier</span>

                <strong>
                  ${
                    escapeHtmlV3_(
                      material.fmrLineId
                    )
                  }
                </strong>
              </div>
            </div>

            ${
              activeBags.length
                ? `
                  <div class="field-active-bags">
                    <div class="field-subsection-title">
                      Active Bag &amp; Tags
                    </div>

                    <div class="field-bag-chip-list">
                      ${activeBags.map(bag => `
                        <div class="field-bag-chip">
                          <strong>
                            ${
                              escapeHtmlV3_(
                                bag.tagNumber
                              )
                            }
                          </strong>

                          <span>
                            ${
                              formatQtyV3_(
                                bag.qtyRemaining
                              )
                            }
                            ${
                              escapeHtmlV3_(
                                bag.uom
                              )
                            }
                            remaining
                          </span>

                          <span>
                            ${
                              escapeHtmlV3_(
                                bag.storageLocation ||
                                'Location not recorded'
                              )
                            }
                          </span>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                `
                : ''
            }

            <div class="field-line-actions">
              ${
                renderFieldActionsV3_(
                  material,
                  workflow
                )
              }
            </div>
          </div>
        </article>
      `;
    }

    function fieldWorkflowForMaterialV3_(
      material
    ) {
      if (
        material.workflow &&
        Array.isArray(
          material.workflow.actions
        )
      ) {
        return material.workflow;
      }

      const limits =
        material.actionLimits || {};

      const actions = [];

      const pushAction = (
        action,
        label,
        group,
        maximum,
        requiredFields,
        optionalFields,
        helpText,
        sources
      ) => {
        if (
          Number(maximum || 0) <= 0
        ) {
          return;
        }

        actions.push({
          action,
          label,
          group,
          maxQuantity:
            Number(maximum || 0),
          uom:
            material.uom || '',
          requiredFields:
            requiredFields || [],
          optionalFields:
            optionalFields || [],
          helpText:
            helpText || '',
          quantityLimitScope:
            sources && sources.length
              ? 'SELECTED_BAG'
              : 'LINE',
          sources:
            sources || []
        });
      };

      const bagSources =
        (material.activeBags || [])
          .filter(
            bag =>
              Number(
                bag.qtyRemaining || 0
              ) > 0
          )
          .map(bag => ({
            bagTagId:
              bag.bagTagId,
            tagNumber:
              bag.tagNumber,
            storageLocation:
              bag.storageLocation,
            qtyRemaining:
              Number(
                bag.qtyRemaining || 0
              ),
            uom:
              bag.uom,
            status:
              bag.status
          }));

      const bagMaximum =
        bagSources.reduce(
          (
            total,
            bag
          ) =>
            total +
            Number(
              bag.qtyRemaining || 0
            ),
          0
        );

      pushAction(
        'ISSUE_FROM_BAG',
        'Issue From Bag',
        'ISSUE',
        bagMaximum,
        [
          'quantity',
          'bagTagId',
          'issuedToName',
          'performedByName'
        ],
        ['notes'],
        'Issue material already reserved under an active Bag & Tag.',
        bagSources
      );

      pushAction(
        'ISSUE_FROM_AVAILABLE',
        'Issue Available',
        'ISSUE',
        limits.issueAvailable,
        [
          'quantity',
          'issuedToName',
          'performedByName'
        ],
        ['notes'],
        'Issue material that has already been located and is available.'
      );

      pushAction(
        'DIRECT_ISSUE',
        'Locate & Issue',
        'ISSUE',
        limits.directIssue,
        [
          'quantity',
          'issuedToName',
          'performedByName'
        ],
        [
          'storageLocation',
          'notes'
        ],
        'Locate material and issue it directly to the recipient.'
      );

      pushAction(
        'BAG',
        'Bag & Tag',
        'RESERVE',
        limits.bag,
        [
          'quantity',
          'storageLocation',
          'performedByName'
        ],
        ['notes'],
        'Reserve material under a new Bag & Tag.'
      );

      pushAction(
        'CONFIRM_AVAILABLE',
        'Confirm Available',
        'LOCATE',
        limits.confirmAvailable,
        [
          'quantity',
          'performedByName'
        ],
        [
          'storageLocation',
          'notes'
        ],
        'Record material as physically located and available.'
      );

      pushAction(
        'BACKORDER_REQUESTED',
        'Submit Backorder',
        'EXCEPTION',
        limits.backorder,
        [
          'quantity',
          'reason',
          'performedByName'
        ],
        ['notes'],
        'Submit unresolved material for Admin review.'
      );

      const remaining =
        Number(
          material.qtyRemainingRequirement ||
          0
        );

      const available =
        Number(
          material.qtyAvailable || 0
        );

      const returnedCount =
        (
          material.returnedBackorders || []
        ).length;

      let phase =
        'NO_ACTION';

      let headline =
        'No Field action is currently available.';

      if (remaining <= 0) {
        phase = 'COMPLETE';
        headline =
          'The requested requirement is complete.';
      } else if (returnedCount) {
        phase =
          'FIELD_REVIEW_REQUIRED';
        headline =
          'Admin returned a backorder request for Field review.';
      } else if (bagSources.length) {
        phase =
          'ISSUE_RESERVED';
        headline =
          'Reserved material is ready to issue from an active Bag & Tag.';
      } else if (available > 0) {
        phase =
          'ISSUE_OR_RESERVE_AVAILABLE';
        headline =
          'Located material is available to issue or reserve.';
      } else if (actions.length) {
        phase =
          'LOCATE_OR_EXCEPTION';
        headline =
          'Material still needs to be located, reserved, issued, or submitted for review.';
      }

      return {
        phase,
        headline,
        isComplete:
          remaining <= 0,
        requiresFieldReview:
          returnedCount > 0,
        returnedReviewCount:
          returnedCount,
        hasPendingAdminReview:
          Number(
            material.qtyPendingBackorder ||
            0
          ) > 0,
        activeBagCount:
          bagSources.length,
        availableActionCount:
          actions.length,
        actions
      };
    }

    function workflowPhaseClassV3_(
      phase
    ) {
      return (
        'field-phase-' +
        String(
          phase || 'NO_ACTION'
        )
          .toLowerCase()
          .replace(/_/g, '-')
      );
    }

    function workflowGroupLabelV3_(
      group
    ) {
      const labels = {
        ISSUE:
          'Issue Material',
        RESERVE:
          'Reserve Material',
        LOCATE:
          'Locate Material',
        EXCEPTION:
          'Exception'
      };

      return (
        labels[
          String(group || '')
            .toUpperCase()
        ] ||
        group ||
        'Other'
      );
    }

    function findWorkflowActionV3_(
      material,
      action
    ) {
      const workflow =
        fieldWorkflowForMaterialV3_(
          material
        );

      return (
        (workflow.actions || [])
          .find(
            item =>
              item.action === action
          ) ||
        null
      );
    }

    function renderFieldActionsV3_(
      material,
      workflow
    ) {
      if (
        !state.bootstrap ||
        !state.bootstrap
          .user
          .canFieldTransact
      ) {
        return `
          <div class="muted">
            This line is read only for your account.
          </div>
        `;
      }

      const actions =
        (
          workflow &&
          Array.isArray(
            workflow.actions
          )
            ? workflow.actions
            : []
        )
          .filter(
            action =>
              Number(
                action.maxQuantity || 0
              ) > 0
          );

      if (!actions.length) {
        return `
          <div class="field-no-actions">
            No Field transaction is currently available
            for this material line.
          </div>
        `;
      }

      const grouped = {};

      actions.forEach(action => {
        const group =
          String(
            action.group || 'OTHER'
          ).toUpperCase();

        if (!grouped[group]) {
          grouped[group] = [];
        }

        grouped[group].push(action);
      });

      const groupOrder = [
        'ISSUE',
        'RESERVE',
        'LOCATE',
        'EXCEPTION',
        'OTHER'
      ];

      return `
        <div class="field-action-groups">
          ${groupOrder
            .filter(
              group =>
                grouped[group] &&
                grouped[group].length
            )
            .map(group => `
              <div
                class="field-action-group"
                data-action-group="${
                  escapeAttributeV3_(
                    group
                  )
                }">

                <div class="field-action-group-title">
                  ${
                    escapeHtmlV3_(
                      workflowGroupLabelV3_(
                        group
                      )
                    )
                  }
                </div>

                <div class="field-action-buttons">
                  ${grouped[group].map(action => `
                    <button
                      type="button"
                      class="field-workflow-action"
                      data-field-action="${
                        escapeAttributeV3_(
                          action.action
                        )
                      }"
                      data-line-id="${
                        escapeAttributeV3_(
                          material.fmrLineId
                        )
                      }">

                      <span>
                        ${
                          escapeHtmlV3_(
                            action.label
                          )
                        }
                      </span>

                      <small>
                        Up to
                        ${
                          formatQtyV3_(
                            action.maxQuantity
                          )
                        }
                        ${
                          escapeHtmlV3_(
                            action.uom ||
                            material.uom
                          )
                        }
                      </small>
                    </button>
                  `).join('')}
                </div>
              </div>
            `)
            .join('')}
        </div>
      `;
    }

    function addActionButtonV3_(
      target,
      action,
      label,
      lineId,
      maximum
    ) {
      if (
        Number(maximum || 0) <= 0
      ) {
        return;
      }

      target.push(`
        <button
          type="button"
          class="small"
          data-field-action="${
            escapeAttributeV3_(action)
          }"
          data-line-id="${
            escapeAttributeV3_(lineId)
          }">
          ${escapeHtmlV3_(label)}
        </button>
      `);
    }

    function findMaterialV3_(lineId) {
      for (
        const card of
        (state.fieldData?.cards || [])
      ) {
        const material =
          (card.materials || [])
            .find(
              item =>
                item.fmrLineId === lineId
            );

        if (material) {
          return {
            card,
            material
          };
        }
      }

      throw new Error(
        `Material line not found: ${lineId}`
      );
    }

    function openActionModalV3_(
      action,
      card,
      material,
      workflowAction
    ) {
      state.activeAction = action;
      state.activeCard = card;
      state.activeMaterial = material;
      state.activeWorkflowAction =
        workflowAction ||
        findWorkflowActionV3_(
          material,
          action
        );

      byId('modalTitle').textContent =
        state.activeWorkflowAction &&
        state.activeWorkflowAction.label
          ? state.activeWorkflowAction.label
          : actionLabelV3_(action);

      byId('modalContext').textContent =
        `${card.fmrNumber} · ` +
        `${material.isoKey} · ` +
        `${material.commodityCode}`;

      byId('modalFields').innerHTML =
        buildActionFieldsV3_(
          action,
          material,
          state.activeWorkflowAction
        );

      byId('actionModal')
        .classList
        .remove('hidden');

      setFieldActionBusyV3_(
        false
      );

      const bagSelect =
        byId('actionBagTag');

      if (bagSelect) {
        bagSelect.addEventListener(
          'change',
          syncBagQuantityLimitV3_
        );

        syncBagQuantityLimitV3_();
      }

      const quantityInput =
        byId('actionQuantity');

      if (quantityInput) {
        quantityInput.focus();
      }
    }

    function workflowFieldRequiredV3_(
      descriptor,
      fieldName
    ) {
      return Boolean(
        descriptor &&
        Array.isArray(
          descriptor.requiredFields
        ) &&
        descriptor.requiredFields.includes(
          fieldName
        )
      );
    }

    function workflowHasFieldV3_(
      descriptor,
      fieldName
    ) {
      if (!descriptor) {
        return true;
      }

      return (
        workflowFieldRequiredV3_(
          descriptor,
          fieldName
        ) ||
        (
          Array.isArray(
            descriptor.optionalFields
          ) &&
          descriptor.optionalFields.includes(
            fieldName
          )
        )
      );
    }

    function buildActionFieldsV3_(
      action,
      material,
      descriptor
    ) {
      const workflowAction =
        descriptor || {
          action,
          label:
            actionLabelV3_(action),
          group:
            'OTHER',
          maxQuantity:
            0,
          uom:
            material.uom || '',
          requiredFields: [],
          optionalFields: [],
          helpText: '',
          sources: []
        };

      const required = fieldName =>
        workflowFieldRequiredV3_(
          workflowAction,
          fieldName
        )
          ? 'required'
          : '';

      const hasField = fieldName =>
        workflowHasFieldV3_(
          workflowAction,
          fieldName
        );

      const maximum =
        Number(
          workflowAction.maxQuantity ||
          0
        );

      const uom =
        workflowAction.uom ||
        material.uom ||
        '';

      const sources =
        Array.isArray(
          workflowAction.sources
        ) &&
        workflowAction.sources.length
          ? workflowAction.sources
          : (
              material.activeBags || []
            );

      const reasons =
        state.bootstrap &&
        state.bootstrap.field &&
        state.bootstrap.field.options
          ? (
              state.bootstrap
                .field
                .options
                .backorderReasons || []
            )
          : [];

      const storageLocations =
        state.bootstrap &&
        state.bootstrap.field &&
        state.bootstrap.field.options
          ? (
              state.bootstrap
                .field
                .options
                .storageLocations || []
            )
          : [];

      const currentStorageLocation =
        storageLocations.find(
          location =>
            String(
              location || ''
            ).toUpperCase() ===
            String(
              material.storageLocation || ''
            ).toUpperCase()
        ) || '';

      const fields = [];

      fields.push(`
        <div class="workflow-modal-guide">
          <div class="workflow-modal-guide-heading">
            <span
              class="workflow-group-badge"
              data-workflow-group="${
                escapeAttributeV3_(
                  workflowAction.group ||
                  'OTHER'
                )
              }">

              ${
                escapeHtmlV3_(
                  workflowGroupLabelV3_(
                    workflowAction.group
                  )
                )
              }
            </span>

            <strong>
              Maximum:
              ${
                formatQtyV3_(
                  maximum
                )
              }
              ${
                escapeHtmlV3_(
                  uom
                )
              }
            </strong>
          </div>

          <p>
            ${
              escapeHtmlV3_(
                workflowAction.helpText ||
                'Complete the required information and submit the transaction.'
              )
            }
          </p>
        </div>

        <div
          id="fieldActionProgress"
          class="field-action-progress hidden"
          role="status"
          aria-live="polite">

          <span
            class="field-action-progress-spinner"
            aria-hidden="true">
          </span>

          <span data-field-action-progress-text>
            Saving transaction…
          </span>
        </div>
      `);

      if (
        hasField('bagTagId')
      ) {
        fields.push(`
          <label>
            Bag Tag

            <select
              id="actionBagTag"
              ${required('bagTagId')}>

              ${sources.map(source => `
                <option
                  value="${
                    escapeAttributeV3_(
                      source.bagTagId
                    )
                  }"
                  data-remaining="${
                    escapeAttributeV3_(
                      source.qtyRemaining
                    )
                  }"
                  data-uom="${
                    escapeAttributeV3_(
                      source.uom || uom
                    )
                  }">

                  ${
                    escapeHtmlV3_(
                      source.tagNumber
                    )
                  } ·

                  ${
                    formatQtyV3_(
                      source.qtyRemaining
                    )
                  }

                  ${
                    escapeHtmlV3_(
                      source.uom || uom
                    )
                  }

                  ${
                    source.storageLocation
                      ? ` · ${escapeHtmlV3_(
                          source.storageLocation
                        )}`
                      : ''
                  }
                </option>
              `).join('')}
            </select>

            <span
              id="actionBagTagHint"
              class="workflow-field-hint">
            </span>
          </label>
        `);
      }

      if (
        hasField('quantity')
      ) {
        fields.push(`
          <label>
            Quantity

            <input
              id="actionQuantity"
              type="number"
              min="0.000001"
              max="${
                escapeAttributeV3_(
                  maximum
                )
              }"
              step="any"
              inputmode="decimal"
              ${required('quantity')}>

            <span
              id="actionQuantityHint"
              class="workflow-field-hint">

              Enter up to
              ${
                formatQtyV3_(
                  maximum
                )
              }
              ${
                escapeHtmlV3_(
                  uom
                )
              }.
            </span>
          </label>
        `);
      }

      if (
        hasField('issuedToName')
      ) {
        fields.push(`
          <label>
            Issued To

            <input
              id="actionIssuedTo"
              autocomplete="off"
              ${required(
                'issuedToName'
              )}>
          </label>
        `);
      }

      if (
        hasField(
          'storageLocation'
        )
      ) {
        fields.push(`
          <label>
            Storage Location

            <select
              id="actionStorageLocation"
              ${required(
                'storageLocation'
              )}>

              <option value="">
                ${
                  required(
                    'storageLocation'
                  )
                    ? 'Select a configured location'
                    : 'No storage location'
                }
              </option>

              ${storageLocations.map(location => `
                <option
                  value="${
                    escapeAttributeV3_(
                      location
                    )
                  }"
                  ${
                    location ===
                    currentStorageLocation
                      ? 'selected'
                      : ''
                  }>

                  ${
                    escapeHtmlV3_(
                      location
                    )
                  }
                </option>
              `).join('')}
            </select>

            <span class="workflow-field-hint">
              Only locations configured by the System Owner are accepted.
            </span>
          </label>
        `);
      }
      if (
        hasField('reason')
      ) {
        fields.push(`
          <label>
            Backorder Reason

            <select
              id="actionReason"
              ${required('reason')}>

              ${reasons.map(reason => `
                <option
                  value="${
                    escapeAttributeV3_(
                      reason
                    )
                  }">

                  ${
                    escapeHtmlV3_(
                      reason
                    )
                  }
                </option>
              `).join('')}
            </select>
          </label>
        `);
      }

      if (
        hasField(
          'performedByName'
        )
      ) {
        fields.push(`
          <label>
            Performed By

            <input
              id="actionPerformedBy"
              class="field-authenticated-performer"
              autocomplete="name"
              value="${
                escapeAttributeV3_(
                  state.bootstrap.user.name ||
                  state.bootstrap.user.email
                )
              }"
              readonly
              aria-readonly="true"
              ${required(
                'performedByName'
              )}>

            <span class="workflow-field-hint">
              Recorded from the authenticated Google account.
            </span>
          </label>
        `);
      }

      if (
        hasField('notes')
      ) {
        fields.push(`
          <label>
            Notes

            <textarea
              id="actionNotes"
              rows="3"
              maxlength="500"
              ${required('notes')}></textarea>
          </label>
        `);
      }

      return fields.join('');
    }

    function syncBagQuantityLimitV3_() {
      const select =
        byId('actionBagTag');

      const quantityInput =
        byId('actionQuantity');

      const quantityHint =
        byId('actionQuantityHint');

      const bagHint =
        byId('actionBagTagHint');

      if (
        !select ||
        !quantityInput ||
        !select.selectedOptions.length
      ) {
        return;
      }

      const option =
        select.selectedOptions[0];

      const remaining =
        Number(
          option.dataset.remaining ||
          0
        );

      const uom =
        option.dataset.uom ||
        (
          state.activeMaterial
            ? state.activeMaterial.uom
            : ''
        );

      quantityInput.max =
        String(remaining);

      if (
        Number(
          quantityInput.value || 0
        ) > remaining
      ) {
        quantityInput.value = '';
      }

      if (quantityHint) {
        quantityHint.textContent =
          `Enter up to ${formatQtyV3_(
            remaining
          )} ${uom} from the selected tag.`;
      }

      if (bagHint) {
        bagHint.textContent =
          `${formatQtyV3_(
            remaining
          )} ${uom} remains in this tag.`;
      }
    }

    async function submitFieldActionV3_(
      event
    ) {
      event.preventDefault();

      if (
        state.fieldTransactionBusy
      ) {
        return;
      }

      const form =
        byId(
          'actionForm'
        );

      if (
        form &&
        !form.checkValidity()
      ) {
        form.reportValidity();
        return;
      }

      const lineId =
        state.activeMaterial
          .fmrLineId;

      const request = {
        action:
          state.activeAction,

        fmrLineId:
          lineId,

        quantity:
          numberValueV3_(
            'actionQuantity'
          ),

        performedByName:
          valueOfV3_(
            'actionPerformedBy'
          ),

        issuedToName:
          valueOfV3_(
            'actionIssuedTo'
          ),

        storageLocation:
          valueOfV3_(
            'actionStorageLocation'
          ),

        bagTagId:
          valueOfV3_(
            'actionBagTag'
          ),

        reason:
          valueOfV3_(
            'actionReason'
          ),

        notes:
          valueOfV3_(
            'actionNotes'
          )
      };

      const started =
        Date.now();

      setFieldActionBusyV3_(
        true,
        'Saving transaction and updating material quantities…'
      );

      try {
        const result =
          await callServerV3_(
            'performFieldActionV3',
            request
          );

        state
          .fieldExpandedLineIds
          .add(
            lineId
          );

        applyFieldActionResultV3_(
          result
        );

        setFieldActionBusyV3_(
          false
        );

        closeActionModalV3_();

        const elapsedSeconds =
          Math.max(
            0.1,
            (
              Date.now() -
              started
            ) /
            1000
          ).toFixed(
            1
          );

        showSuccessV3_(
          (
            (
              result.message ||
              'Field transaction completed.'
            ) +
            ' Saved in ' +
            elapsedSeconds +
            ' seconds.'
          )
        );

        byId(
          'fieldStatus'
        ).textContent =
          'Saved. Verifying the current indexed state…';

        await runFieldSearchV3_({
          preserveView:
            true,

          silent:
            true
        });
      } catch (
        error
      ) {
        setFieldActionBusyV3_(
          false
        );

        showErrorV3_(
          error
        );
      }
    }

    function setFieldActionBusyV3_(
      busy,
      message
    ) {
      state.fieldTransactionBusy =
        Boolean(
          busy
        );

      const form =
        byId(
          'actionForm'
        );

      const submit =
        byId(
          'modalSubmit'
        );

      const cancel =
        byId(
          'modalCancel'
        );

      const close =
        byId(
          'modalClose'
        );

      const progress =
        byId(
          'fieldActionProgress'
        );

      if (form) {
        form.setAttribute(
          'aria-busy',
          String(
            state
              .fieldTransactionBusy
          )
        );
      }

      if (submit) {
        submit.disabled =
          state
            .fieldTransactionBusy;

        submit.textContent =
          state
            .fieldTransactionBusy
            ? 'Saving…'
            : 'Submit';
      }

      if (cancel) {
        cancel.disabled =
          state
            .fieldTransactionBusy;
      }

      if (close) {
        close.disabled =
          state
            .fieldTransactionBusy;
      }

      if (progress) {
        progress.classList.toggle(
          'hidden',
          !state
            .fieldTransactionBusy
        );

        const text =
          progress.querySelector(
            '[data-field-action-progress-text]'
          );

        if (text) {
          text.textContent =
            message ||
            'Saving transaction…';
        }
      }
    }

    function applyFieldActionResultV3_(
      result
    ) {
      const updatedLine =
        result &&
        result.line
          ? result.line
          : null;

      if (
        !updatedLine ||
        !state.fieldData ||
        !Array.isArray(
          state.fieldData.cards
        )
      ) {
        return;
      }

      state.fieldData.cards
        .some(
          card => {
            const materials =
              card.materials || [];

            const index =
              materials.findIndex(
                material =>
                  material.fmrLineId ===
                  updatedLine.fmrLineId
              );

            if (
              index < 0
            ) {
              return false;
            }

            materials[
              index
            ] =
              updatedLine;

            card.materials =
              materials;

            card.totals =
              calculateFieldCardTotalsV3_(
                materials
              );

            card.status =
              calculateFieldCardStatusV3_(
                card.totals
              );

            return true;
          }
        );

      renderFieldResultsV3_(

    function calculateFieldCardTotalsV3_(
      materials
    ) {
      const total =
        fieldName =>
          (
            materials || []
          ).reduce(
            (
              sum,
              material
            ) =>
              sum +
              Number(
                material[
                  fieldName
                ] ||
                0
              ),
            0
          );

      const requested =
        total(
          'qtyRequested'
        );

      const issued =
        total(
          'qtyIssued'
        );

      return {
        requested:
          requested,

        located:
          total(
            'qtyConfirmedLocated'
          ),

        bagged:
          total(
            'qtyActiveBagged'
          ),

        available:
          total(
            'qtyAvailable'
          ),

        issued:
          issued,

        pendingBackorder:
          total(
            'qtyPendingBackorder'
          ),

        confirmedBackorder:
          total(
            'qtyConfirmedBackorder'
          ),

        remaining:
          total(
            'qtyRemainingRequirement'
          ),

        fulfillmentPct:
          requested > 0
            ? issued /
              requested
            : 0
      };
    }

    function calculateFieldCardStatusV3_(
      totals
    ) {
      const stateValue =
        totals || {};

      if (
        Number(
          stateValue.remaining ||
          0
        ) <= 0 &&
        Number(
          stateValue.requested ||
          0
        ) > 0
      ) {
        return 'Issued';
      }

      if (
        Number(
          stateValue.issued ||
          0
        ) > 0
      ) {
        return 'Partially Issued';
      }

      if (
        Number(
          stateValue.confirmedBackorder ||
          0
        ) > 0
      ) {
        return 'Backordered';
      }

      if (
        Number(
          stateValue.pendingBackorder ||
          0
        ) > 0
      ) {
        return 'Pending Backorder';
      }

      if (
        Number(
          stateValue.bagged ||
          0
        ) > 0
      ) {
        return 'Partially Bagged';
      }

      if (
        Number(
          stateValue.located ||
          0
        ) > 0
      ) {
        return 'Partially Located';
      }

      return 'Published';
    }

    function formatAdminKpiV3_(
      value,
      label
    ) {
      if (
        label === 'Fulfillment'
      ) {
        return String(
          value == null
            ? '0%'
            : value
        );
      }

      const normalized =
        String(
          value == null
            ? ''
            : value
        )
          .replace(/,/g, '')
          .trim();

      const number =
        Number(normalized);

      return Number.isFinite(number)
        ? formatQtyV3_(number)
        : String(
            value == null
              ? '0'
              : value
          );
    }

    function replaceSelectOptionsV3_(

      allLabel,
      values

      const normalizedCurrent =
        current.toUpperCase();

      select.innerHTML = `
        <option value="ALL">
          ${escapeHtmlV3_(allLabel)}

        ${
          (values || [])
            .map(value => `
              <option
                value="${
                  escapeAttributeV3_(

                  )
                }">

                ${
                  escapeHtmlV3_(
                    value
                  )
                }
              </option>
            `)
            .join('')
        }
      `;

      const optionExists =
        Array.from(select.options)
          .some(
            option =>
              option.value ===
              normalizedCurrent
          );

      select.value =
        optionExists
          ? normalizedCurrent
          : 'ALL';
    }

    function statusClassV3_(status) {
      const value =
        String(status || '')
          .toLowerCase();

      if (value === 'issued') {
        return 'status-issued';
      }

      if (value === 'located') {
        return 'status-located';
      }

      if (
        value.includes('partial')
      ) {
        return 'status-partial';
      }

      if (
        value.includes('sourcing') ||
        value.includes('backorder')
      ) {
        return 'status-sourcing';
      }

      if (
        value.includes('hold')
      ) {
        return 'status-hold';
      }

      if (
        value.includes('cancel')
      ) {
        return 'status-cancelled';
      }

      return '';
    }

    function formatPercentV3_(value) {
      const number =
        Number(value || 0);

      return `${
        (number * 100).toFixed(1)
      }%`;
    }

              }
            </div>

            <div class="queue-meta">
              ISO
              ${
                escapeHtmlV3_(
                  request.isoKey
                )
              } ·

              Pending
              ${
                formatQtyV3_(
                  request.qtyPending
                )
              }

              of

              ${
                formatQtyV3_(
                  request.qtyRequested
                )
              }

              <br>

              ${
                escapeHtmlV3_(
                  request.reason
                )
              }

              <br>

              Reported by

              ${
                escapeHtmlV3_(
                  request.reportedBy
                )
              } ·

              ${
                escapeHtmlV3_(
                  request.reportedAt
                )
              }

              ${
                request.fieldNotes
                  ? `
                    <br>
                    ${
                      escapeHtmlV3_(
                        request.fieldNotes
                      )
                    }
                  `
                  : ''
              }
            </div>

            ${
              canReview
                ? `
                  <div class="queue-actions">
                    <button
                      class="small"
                      data-backorder-decision="CONFIRM"
                      data-request-id="${
                        escapeAttributeV3_(
                          request.requestId
                        )
                      }"
                      data-pending="${
                        escapeAttributeV3_(
                          request.qtyPending
                        )
                      }">

                      Confirm
                    </button>

                    <button
                      class="small danger"
                      data-backorder-decision="REJECT"
                      data-request-id="${
                        escapeAttributeV3_(
                          request.requestId
                        )
                      }">

                      Reject
                    </button>

                    <button
                      class="small warning"
                      data-backorder-decision="RETURN"
                      data-request-id="${
                        escapeAttributeV3_(
                          request.requestId
                        )
                      }">

                      Return for Review
                    </button>
                  </div>
                `
                : `
                  <div class="muted">
                    Read-only queue.
                  </div>
                `
            }
          </article>
        `).join('');

      container
        .querySelectorAll(
          '[data-backorder-decision]'
        )
        .forEach(button => {
          button.addEventListener(
            'click',
            () => {
              submitBackorderDecisionV3_(
                button.dataset.requestId,
                button.dataset
                  .backorderDecision,
                Number(
                  button.dataset.pending ||
                  0
                )
              );
            }
          );
        });
    }

              <div class="queue-meta">
                <strong>
                  ${

                ${

                <div

                    <span>

                    </span>
                  </div>

                  <div>

                  </div>

                  <div>
                    <span class="label">
                      Bagged
                    </span>

                    <span>
                      ${
                        formatQtyV3_(
                          record.qtyBagged

                      }

                      ${
                        escapeHtmlV3_(
                          record.uom
                        )
                      }
                    </span>
                  </div>

                  <div>
                    <span class="label">
                      Issued
                    </span>

                    <span>
                      ${
                        formatQtyV3_(

                          record.uom

                      }
                    </span>
                  </div>

                  <div

                    <span class="label">
                      Remaining
                    </span>

                    <span>

                        )
                      }
                    </span>

                            record.baggedAt

                        }
                      `

                ${
                  record.notes
