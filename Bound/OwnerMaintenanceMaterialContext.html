<style>
  /*
   * FMR Operations v3 — Alpha 29.2
   * Transaction-only material context for Owner Correction.
   *
   * Complete replacement for:
   * Bound/OwnerMaintenanceMaterialContext.html
   */

  .om-material-context {
    display: none !important;
  }

  .om-transaction-material {
    margin: 9px 0 8px;
    padding: 10px 11px;
    border: 1px solid #cfe0ed;
    border-left: 4px solid #8bbfe2;
    border-radius: 8px;
    background: #f8fbfe;
  }

  .om-transaction-material-grid {
    display: grid;
    grid-template-columns:
      minmax(140px, .85fr)
      minmax(80px, .45fr)
      minmax(95px, .5fr)
      minmax(150px, 1.4fr);
    gap: 8px;
    align-items: start;
  }

  .om-transaction-material-field {
    min-width: 0;
  }

  .om-transaction-material-field.description {
    grid-column: 1 / -1;
    padding-top: 7px;
    border-top: 1px solid #d7e2ec;
  }

  .om-transaction-material-label {
    display: block;
    margin-bottom: 3px;
    color: var(--muted);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .025em;
    text-transform: uppercase;
  }

  .om-transaction-material-value {
    display: block;
    min-width: 0;
    color: var(--text);
    font-size: 13px;
    font-weight: 750;
    line-height: 1.4;
    text-align: left;
    white-space: normal;
    overflow-wrap: anywhere;
    word-break: normal;
  }

  .om-transaction-material-field.description
    .om-transaction-material-value {
    font-size: 14px;
  }

  .om-transaction-line {
    padding: 8px 0;
    border-top: 1px solid var(--border);
  }

  .om-transaction-line:first-child {
    border-top: 0;
  }

  .om-reversal-material-summary {
    margin: 0 0 12px;
    padding: 12px;
    border: 1px solid #b8d7ed;
    border-left: 5px solid var(--blue);
    border-radius: 9px;
    background: #f5faff;
  }

  .om-reversal-material-summary h4 {
    margin: 0 0 8px;
  }

  .om-reversal-warning {
    margin: 8px 0 0;
    color: var(--danger);
    font-size: 12px;
    font-weight: 750;
  }

  .om-reversal-transaction-list {
    display: grid;
    gap: 7px;
    margin-top: 10px;
  }

  .om-reversal-transaction-row {
    display: grid;
    grid-template-columns:
      minmax(120px, .75fr)
      minmax(70px, .35fr)
      minmax(180px, 1.4fr);
    gap: 8px;
    padding: 8px 9px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: white;
  }

  .om-reversal-transaction-row strong,
  .om-reversal-transaction-row span {
    min-width: 0;
    overflow-wrap: anywhere;
  }

  /*
   * The Alpha 29 preview includes a raw JSON <pre>. Keep it available for
   * technical traceability, but make it secondary instead of the first thing
   * the Owner must interpret.
   */
  .owner-correction-preview pre {
    margin-top: 12px;
    opacity: .82;
  }

  @media (max-width: 760px) {
    .om-transaction-material-grid,
    .om-reversal-transaction-row {
      grid-template-columns: 1fr;
    }

    .om-transaction-material-field.description {
      grid-column: auto;
    }
  }
</style>

<script>
(() => {
  const alpha292 = {
    ledger: null,
    pendingPreviewGroupId: '',
    searchSequence: 0
  };

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function callServer(name, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)[name](...args);
    });
  }

  function lineIso(line) {
    const number = String(line && line.isoNumber || '').trim();
    const sheet = String(line && line.isoSheet || '').trim();

    if (number && sheet) {
      return number + '-' + String(sheet).padStart(2, '0');
    }

    return number || sheet || '—';
  }

  function lineById(lineId) {
    const lines =
      alpha292.ledger &&
      Array.isArray(alpha292.ledger.lines)
        ? alpha292.ledger.lines
        : [];

    return lines.find(line =>
      String(line.fmrLineId || '') === String(lineId || '')
    ) || null;
  }

  function groupById(groupId) {
    const groups =
      alpha292.ledger &&
      Array.isArray(alpha292.ledger.groups)
        ? alpha292.ledger.groups
        : [];

    return groups.find(group =>
      String(group.groupId || '') === String(groupId || '')
    ) || null;
  }

  function materialHtml(line) {
    if (!line) {
      return `
        <div class="om-transaction-material">
          <span class="om-transaction-material-value">
            Material-line information was not found for this transaction.
          </span>
        </div>
      `;
    }

    return `
      <div class="om-transaction-material">
        <div class="om-transaction-material-grid">
          <div class="om-transaction-material-field">
            <span class="om-transaction-material-label">
              Commodity Code
            </span>
            <span class="om-transaction-material-value">
              ${esc(line.commodityCode || '—')}
            </span>
          </div>

          <div class="om-transaction-material-field">
            <span class="om-transaction-material-label">
              Size
            </span>
            <span class="om-transaction-material-value">
              ${esc(line.size || '—')}
            </span>
          </div>

          <div class="om-transaction-material-field">
            <span class="om-transaction-material-label">
              UOM
            </span>
            <span class="om-transaction-material-value">
              ${esc(line.uom || '—')}
            </span>
          </div>

          <div class="om-transaction-material-field">
            <span class="om-transaction-material-label">
              ISO
            </span>
            <span class="om-transaction-material-value">
              ${esc(lineIso(line))}
            </span>
          </div>

          <div class="om-transaction-material-field description">
            <span class="om-transaction-material-label">
              Material Description
            </span>
            <span class="om-transaction-material-value">
              ${esc(line.materialDescription || '—')}
            </span>
          </div>
        </div>
      </div>
    `;
  }

  function materialContextForGroup(group) {
    const lineIds = Array.from(
      new Set(
        (group && group.transactions || [])
          .map(txn => String(txn.fmrLineId || ''))
          .filter(Boolean)
      )
    );

    return lineIds
      .map(lineId => materialHtml(lineById(lineId)))
      .join('');
  }

  function removeWholeFmrMaterialDisplay() {
    /*
     * Alpha 29.1 added a large Matching Material Lines section.
     * The Owner only needs material identity attached to transactions, so
     * remove that presentation when it exists.
     */
    const wholeFmr = document.getElementById('omLedgerMaterialContext');

    if (wholeFmr) {
      wholeFmr.remove();
    }

    document
      .querySelectorAll('.om-material-context')
      .forEach(element => element.remove());
  }

  function enrichRenderedGroups() {
    removeWholeFmrMaterialDisplay();

    if (!alpha292.ledger) {
      return false;
    }

    const groupContainer = document.getElementById('omLedgerGroups');

    if (!groupContainer) {
      return false;
    }

    let enriched = 0;

    groupContainer
      .querySelectorAll('[data-om-reverse]')
      .forEach(button => {
        const groupId = String(
          button.getAttribute('data-om-reverse') || ''
        );

        const group = groupById(groupId);
        const card = button.closest('.owner-maintenance-record');

        if (!group || !card) {
          return;
        }

        card
          .querySelectorAll('.om-transaction-material')
          .forEach(element => element.remove());

        const firstTransaction =
          card.querySelector('.owner-ledger-transaction');

        const wrapper = document.createElement('div');
        wrapper.innerHTML = materialContextForGroup(group);

        const materials = Array.from(wrapper.children);

        if (!materials.length) {
          return;
        }

        if (firstTransaction) {
          materials.reverse().forEach(material => {
            firstTransaction.insertAdjacentElement(
              'beforebegin',
              material
            );
          });
        } else {
          materials.forEach(material => card.appendChild(material));
        }

        enriched += 1;
      });

    return enriched > 0;
  }

  async function loadLedgerForCurrentSearch() {
    const queryInput = document.getElementById('omLedgerQuery');
    const modeInput = document.getElementById('omLedgerMode');

    if (!queryInput || !modeInput) {
      return;
    }

    const query = queryInput.value.trim();

    if (!query) {
      return;
    }

    const sequence = ++alpha292.searchSequence;

    try {
      const result = await callServer(
        'searchOwnerLedgerV3',
        query,
        modeInput.value
      );

      if (sequence !== alpha292.searchSequence) {
        return;
      }

      alpha292.ledger = result;

      /*
       * The original Alpha 29 search and this read-only enhancement call run
       * independently. Poll briefly until Alpha 29 has finished painting the
       * transaction-group DOM, then attach material context to those groups.
       */
      let attempts = 0;

      const timer = window.setInterval(() => {
        attempts += 1;

        if (
          enrichRenderedGroups() ||
          attempts >= 30
        ) {
          window.clearInterval(timer);
        }
      }, 100);
    } catch (error) {
      console.error(
        'Alpha 29.2 material-context lookup failed:',
        error
      );
    }
  }

  function previewMaterialSummary(group) {
    const lineIds = Array.from(
      new Set(
        (group && group.transactions || [])
          .map(txn => String(txn.fmrLineId || ''))
          .filter(Boolean)
      )
    );

    const lines = lineIds
      .map(lineId => lineById(lineId))
      .filter(Boolean);

    const transactionRows = (group.transactions || [])
      .map(txn => {
        const line = lineById(txn.fmrLineId);

        return `
          <div class="om-reversal-transaction-row">
            <strong>${esc(txn.type || 'Transaction')}</strong>

            <span>
              ${esc(txn.quantity == null ? '' : txn.quantity)}
              ${esc(txn.uom || (line && line.uom) || '')}
            </span>

            <span>
              ${esc(
                (line && line.commodityCode) ||
                'Commodity not found'
              )}
              ${line && line.size
                ? ` · Size ${esc(line.size)}`
                : ''}
            </span>
          </div>
        `;
      })
      .join('');

    return `
      <section class="om-reversal-material-summary">
        <h4>You are reversing this material transaction</h4>

        ${lines.map(materialHtml).join('')}

        <div class="om-reversal-transaction-list">
          ${transactionRows}
        </div>

        <div class="om-reversal-warning">
          This reversal changes operational quantities. Confirm the material
          identity, size, description and transaction quantity before applying.
        </div>
      </section>
    `;
  }

  function enhancePreview(groupId) {
    const group = groupById(groupId);

    if (!group) {
      return false;
    }

    const container = document.getElementById('omCorrectionPreview');

    if (!container || !container.children.length) {
      return false;
    }

    const existing =
      container.querySelector('.om-reversal-material-summary');

    if (existing) {
      existing.remove();
    }

    container.insertAdjacentHTML(
      'afterbegin',
      previewMaterialSummary(group)
    );

    return true;
  }

  function waitForPreview(groupId) {
    let attempts = 0;

    const timer = window.setInterval(() => {
      attempts += 1;

      if (
        enhancePreview(groupId) ||
        attempts >= 30
      ) {
        window.clearInterval(timer);
      }
    }, 100);
  }

  function bind() {
    const searchButton = document.getElementById('omLedgerSearch');
    const queryInput = document.getElementById('omLedgerQuery');
    const groups = document.getElementById('omLedgerGroups');

    if (!searchButton || !queryInput || !groups) {
      return false;
    }

    /*
     * Remove any old Alpha 29.1 whole-FMR display immediately.
     */
    removeWholeFmrMaterialDisplay();

    searchButton.addEventListener(
      'click',
      loadLedgerForCurrentSearch
    );

    queryInput.addEventListener(
      'keydown',
      event => {
        if (event.key === 'Enter') {
          loadLedgerForCurrentSearch();
        }
      }
    );

    /*
     * Listen in capture phase so the group ID is recorded before Alpha 29's
     * own delegated click handler starts its async Preview Reversal request.
     */
    groups.addEventListener(
      'click',
      event => {
        const button =
          event.target.closest('[data-om-reverse]');

        if (!button || button.disabled) {
          return;
        }

        const groupId = String(
          button.getAttribute('data-om-reverse') || ''
        );

        alpha292.pendingPreviewGroupId = groupId;
        waitForPreview(groupId);
      },
      true
    );

    return true;
  }

  function waitForOwnerMaintenance() {
    if (bind()) {
      return;
    }

    window.setTimeout(
      waitForOwnerMaintenance,
      150
    );
  }

  if (document.readyState === 'loading') {
    document.addEventListener(
      'DOMContentLoaded',
      waitForOwnerMaintenance
    );
  } else {
    waitForOwnerMaintenance();
  }
})();
</script>
